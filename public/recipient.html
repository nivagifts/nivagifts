<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fdf8f3">
<title>Open Your NIVA Gift</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="/templates.js" defer></script>

<style>
  :root {
    color-scheme: light;
    --bg-cream: #fdf8f3;
    --bg-blush: #faf0ea;
    --bg-rose: #f9e8e4;
    --bg-white: #ffffff;
    --panel: #fffaf6;
    --panel-2: #fff5ef;
    --rose: #d4878e;
    --rose-deep: #b76e79;
    --rose-light: #f0c4c8;
    --champagne: #d4b896;
    --gold: #c9a961;
    --text: #3d2c2e;
    --text-2: #6b5557;
    --text-muted: #9e8588;
    --text-soft: #b8a5a7;
    --line: #f0dfd8;
    --line-soft: #f7ebe5;
    --line-rose: #e8c4c8;
    --line-gold: #e8d9b8;
    --danger: #c75b65;
    --display: 'Playfair Display', Georgia, serif;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --shadow-lg: 0 24px 70px rgba(183, 110, 121, 0.18);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 20px;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg-cream);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(212, 135, 142, 0.12) 0%, transparent 40%),
      radial-gradient(ellipse at 85% 100%, rgba(212, 184, 150, 0.08) 0%, transparent 40%);
    background-attachment: fixed;
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(100%, 460px);
    padding: 36px 28px;
    border: 1px solid var(--line-rose);
    border-radius: 24px;
    background: var(--panel);
    box-shadow: var(--shadow-lg);
    animation: fade-up 0.5s var(--ease) both;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-mark {
    width: 60px;
    height: 60px;
    margin: 0 auto 22px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line-gold);
    border-radius: 50%;
    background: linear-gradient(145deg, var(--bg-rose), var(--bg-white));
    color: var(--rose-deep);
    font: 500 28px/1 var(--display);
    box-shadow: 0 8px 24px rgba(183, 110, 121, 0.15);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  h1 {
    margin: 0 0 12px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.8rem;
    line-height: 1.15;
    color: var(--text);
    text-align: center;
    letter-spacing: -0.01em;
  }

  h1 em { color: var(--rose-deep); font-style: italic; }

  p.intro {
    margin: 0 0 24px;
    line-height: 1.7;
    color: var(--text-2);
    font-size: 0.92rem;
    text-align: center;
    font-family: var(--serif);
  }

  form { margin: 0; }

  label.field-label {
    display: block;
    margin: 0 0 8px;
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 500;
  }

  input[type=password],
  input[type=text] {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-white);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    outline: none;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }

  input::placeholder { color: var(--text-soft); }
  input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(212, 135, 142, 0.12); }

  button[type=submit] {
    width: 100%;
    margin-top: 18px;
    padding: 15px 22px;
    border: 1px solid var(--rose);
    border-radius: 999px;
    background: linear-gradient(110deg, var(--rose-deep), var(--rose));
    color: #fff;
    font-family: var(--sans);
    font-size: 0.94rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    box-shadow: 0 8px 24px rgba(183, 110, 121, 0.28);
    touch-action: manipulation;
  }

  button[type=submit]:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(183, 110, 121, 0.38);
  }

  button[type=submit]:active:not(:disabled) { transform: scale(0.97); }
  button[type=submit]:disabled { opacity: 0.6; cursor: wait; }

  #message {
    margin: 16px 0 0;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.84rem;
    line-height: 1.55;
    text-align: center;
    overflow-wrap: anywhere;
    display: none;
  }

  #message:not(:empty) { display: block; }
  #message.info { background: var(--bg-rose); border: 1px solid var(--line-rose); color: var(--text-2); }
  #message.error {
    background: rgba(199, 91, 101, 0.08);
    border: 1px solid rgba(199, 91, 101, 0.3);
    color: var(--danger);
  }

  .footer-note {
    margin: 22px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
    color: var(--text-muted);
    font-size: 0.74rem;
    line-height: 1.55;
    text-align: center;
    font-style: italic;
    font-family: var(--serif);
  }

  #giftFrame {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg-cream);
    z-index: 100;
  }

  .input-wrap { position: relative; }

  .toggle-pw {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: color 0.2s, background 0.2s;
  }

  .toggle-pw:hover { color: var(--rose-deep); background: var(--bg-rose); }

  .input-wrap input[type=password],
  .input-wrap input[type=text] { padding-right: 52px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<main id="gate">
  <div class="brand-mark" aria-hidden="true">♥</div>

  <h1>Your NIVA gift <em>awaits.</em></h1>
  <p class="intro">Someone made something special just for you. Enter the password they shared to open it.</p>

  <form id="unlockForm" novalidate>
    <label class="field-label" for="giftPassword">Gift password</label>
    <div class="input-wrap">
      <input id="giftPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required maxlength="128" autofocus>
      <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
    </div>
    <button id="unlockButton" type="submit">Unlock my gift ♥</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <p class="footer-note">This gift is private and encrypted. Only you and the sender can see it.</p>
</main>

<iframe id="giftFrame" title="Your private NIVA gift" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

<script>
(() => {
  "use strict";

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const publicId = location.pathname.split("/").filter(Boolean).pop() || "";

  // All element lookups run only after DOM is parsed (script is at end of body).
  const form = document.getElementById("unlockForm");
  const input = document.getElementById("giftPassword");
  const button = document.getElementById("unlockButton");
  const togglePw = document.getElementById("togglePw");
  const message = document.getElementById("message");
  const gate = document.getElementById("gate");
  const frame = document.getElementById("giftFrame");

  if (!form || !input || !button || !message || !gate || !frame) {
    console.error("[NIVA] recipient.html: required DOM elements missing.");
    return;
  }

  function isValidPublicId(id) {
    return typeof id === "string" && /^[A-Za-z0-9_-]{20,80}$/.test(id);
  }

  function fromBase64(value) {
    try {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    } catch {
      throw new Error("Invalid gift data.");
    }
  }

  function showMessage(text, type = "info") {
    message.textContent = text;
    message.className = type;
  }

  togglePw?.addEventListener("click", () => {
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    togglePw.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    togglePw.textContent = isPassword ? "🙈" : "👁";
    input.focus();
  });

  async function decryptGift(envelope, password) {
    if (
      !envelope ||
      typeof envelope !== "object" ||
      envelope.version !== 1 ||
      envelope.kdf !== "PBKDF2-SHA-256" ||
      envelope.iterations !== 310000
    ) {
      throw new Error("This gift cannot be unlocked.");
    }

    const salt = fromBase64(envelope.salt);
    const iv = fromBase64(envelope.iv);
    const ciphertext = fromBase64(envelope.ciphertext);

    if (salt.length !== 16 || iv.length !== 12 || ciphertext.length < 17) {
      throw new Error("This gift cannot be unlocked.");
    }

    const material = await crypto.subtle.importKey(
      "raw",
      encoder.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv },
      key,
      ciphertext
    );

    return JSON.parse(decoder.decode(plaintext));
  }

  // Wait for NivaTemplates to be available (it uses defer, so might not be ready yet).
  async function resolveCategory(templateId) {
    // Give NivaTemplates a moment to load if script is still parsing.
    for (let i = 0; i < 20; i++) {
      if (window.NivaTemplates && typeof window.NivaTemplates.initialize === "function") break;
      await new Promise(r => setTimeout(r, 50));
    }

    try {
      if (window.NivaTemplates) {
        await window.NivaTemplates.initialize();
        const cat = window.NivaTemplates.getCategory(templateId);
        if (cat) return cat;
      }
    } catch (err) {
      console.warn("[NIVA] Registry lookup failed, using fallback:", err);
    }

    // Fallback map — keep in sync with templates.js registry.
    const fallback = {
      "eternal-love": "love",
      "love-proposal": "love",
      "birthday-magic": "birthday",
      "special-letter": "letter",
    };
    return fallback[templateId] || "love";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (button.disabled) return;

    const password = input.value.trim();

    if (!password) {
      showMessage("Please enter the password.", "error");
      input.focus();
      return;
    }

    if (!isValidPublicId(publicId)) {
      showMessage("This gift link is not valid.", "error");
      return;
    }

    button.disabled = true;
    showMessage("Unlocking your gift…", "info");

    try {
      const response = await fetch(`/api/gifts/${encodeURIComponent(publicId)}`, {
        cache: "no-store",
        credentials: "omit",
      });

      if (response.status === 404) {
        throw new Error("This gift does not exist or has been removed.");
      }
      if (!response.ok) {
        throw new Error("We could not reach the gift. Please try again.");
      }

      const result = await response.json().catch(() => ({}));
      if (!result?.gift?.envelope) {
        throw new Error("This gift is unavailable.");
      }

      let gift;
      try {
        gift = await decryptGift(result.gift.envelope, password);
      } catch {
        throw new Error("Incorrect password. Please try again.");
      }

      const templateId = gift.templateId || result.gift.templateId;
      if (
        !templateId ||
        typeof templateId !== "string" ||
        !/^[a-z0-9-]+$/.test(templateId)
      ) {
        throw new Error("This gift uses an invalid template.");
      }

      const category = await resolveCategory(templateId);
      const templateUrl = `/templates/${category}/${templateId}/template.html`;

      // Cache gift for the template to consume (fallback path).
      const previewKey = "niva-preview-" + templateId;
      try {
        sessionStorage.setItem(previewKey, JSON.stringify(gift));
      } catch {}

      // Set up message listener BEFORE loading the iframe.
      const onTemplateMessage = (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.source !== frame.contentWindow) return;
        if (event.data?.type === "NIVA_PREVIEW_READY") {
          try {
            frame.contentWindow.postMessage(
              { type: "NIVA_PREVIEW_UPDATE", data: gift },
              window.location.origin
            );
          } catch (err) {
            console.warn("[NIVA] postMessage failed:", err);
          }

          setTimeout(() => {
            try { sessionStorage.removeItem(previewKey); } catch {}
          }, 2000);

          window.removeEventListener("message", onTemplateMessage);
        }
      };

      window.addEventListener("message", onTemplateMessage);

      // Hide gate, show iframe, load template.
      gate.style.display = "none";
      frame.style.display = "block";
      frame.src = templateUrl;

      // Safety cleanup if the template never posts NIVA_PREVIEW_READY.
      setTimeout(() => {
        window.removeEventListener("message", onTemplateMessage);
        try { sessionStorage.removeItem(previewKey); } catch {}
      }, 15000);

    } catch (err) {
      showMessage(err.message || "Something went wrong. Please try again.", "error");
      input.value = "";
      input.focus();
      button.disabled = false;
    }
  });
})();
</script>

<!-- NIVA bot -->
  <script src="/nivabot.js" defer></script>
</body>
</html>
