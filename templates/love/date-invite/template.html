<script>
"use strict";

/* ============================================================
   STATE
   ============================================================ */
let CONFIG = null;
let currentPage = 1;
let gameState = { active: false, score: 0, timeLeft: 30, target: 10, spawnTimer: null, tickTimer: null };
let selectedDate = "";
let selectedTime = "";
let musicStarted = false;

/* ============================================================
   DEFAULTS
   ============================================================ */
function defaults() {
  return {
    fromName: "Aarav",
    toName: "Diya",
    askEyebrow: "I have something to ask you…",
    askQuestion: "Will you go out with me?",
    askSubtitle: "There's a little plan I've been carrying around in my head for a while. And it involves you.",
    yesButton: "Yes, obviously ♥",
    noButton: "No (for now)",
    letterTitle: "Read this first",
    letterGreeting: "Dear Diya,",
    letterBody: "I've been trying to figure out how to say this without sounding like a fool. So I'm just going to say it: I really like you. Not in a small way — in the kind of way where I think about what you'd say to something before I even do it.\n\nI'd like to take you somewhere. Somewhere quiet. Somewhere where we can talk and laugh and not check the time. Just us, for a few hours.\n\nIf you say yes, I promise to make it a day you'll remember.",
    letterSignature: "Hoping you say yes,",
    letterSignatureName: "Aarav",
    whenTitle: "When works for you?",
    whenSubtitle: "Pick a day and a time — I'll plan everything around it.",
    whenHint: "No pressure, just us.",
    gameTitle: "One last thing",
    gameSubtitle: "Catch 10 hearts in 30 seconds. Each one is a reason to say yes.",
    gameStart: "Start catching",
    gameWin: "You caught every one. And you've made me the happiest person alive. ♥",
    gameLose: "Almost! Try again — the hearts are worth catching. 💕",
    gameTarget: "10",
    finalEyebrow: "It's a date",
    finalTitle: "See you then ♥",
    finalBody: "Bring yourself. Bring your laugh. Bring your stories. Everything else — I'll take care of.",
    finalVenue: "A little café with fairy lights",
    finalFooter: "With all my heart ♥",
    finalButton: "Ask me again ↻",
    songEnabled: "yes",
    songSrc: ""          // ✅ uploaded song URL (set by editor)
  };
}

/* ============================================================
   HELPERS
   ============================================================ */
function setText(id, v) {
  const el = document.getElementById(id);
  if (el && v != null) el.textContent = v;
}
function safeText(v) { return String(v ?? ""); }

/* ============================================================
   ✅ LOAD USER CUSTOMIZATION FROM THE GIFT LINK
   Priority order:
     1. window.__NIVA_GIFT__ (injected by unlock page)
     2. ?config=<base64-json>     (fallback share format)
     3. ?data=<base64-json>       (alternate)
     4. /api/gifts/<id>/config    (fetch by gift id)
     5. config.json               (template defaults)
   ============================================================ */
async function loadUserConfig() {
  // 1. Injected by unlock page (most secure / most common)
  if (window.__NIVA_GIFT__ && typeof window.__NIVA_GIFT__ === "object") {
    return window.__NIVA_GIFT__;
  }

  const params = new URLSearchParams(location.search);

  // 2. Base64 config param
  for (const key of ["config", "data", "c"]) {
    const raw = params.get(key);
    if (raw) {
      try {
        const json = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (json && typeof json === "object") return json;
      } catch {}
    }
  }

  // 3. Gift id → fetch from API
  const giftId = params.get("g") || params.get("gift") || params.get("id");
  if (giftId) {
    try {
      const res = await fetch(`/api/gifts/${encodeURIComponent(giftId)}/config`, {
        credentials: "same-origin", cache: "no-store"
      });
      if (res.ok) {
        const json = await res.json();
        const cfg = json && (json.config || json.data || json);
        if (cfg && typeof cfg === "object") return cfg;
      }
    } catch {}
  }

  // 4. Fall back to static config.json (template defaults)
  try {
    const res = await fetch("config.json", { cache: "no-store" });
    if (res.ok) {
      const json = await res.json();
      if (json) return json;
    }
  } catch {}

  return null;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(cfg) {
  setText("askEyebrow", cfg.askEyebrow);
  setText("askQuestion", cfg.askQuestion);
  setText("askSubtitle", cfg.askSubtitle);
  setText("yesBtnText", cfg.yesButton);
  setText("noBtnText", cfg.noButton);

  setText("letterTitle", cfg.letterTitle);
  setText("letterGreeting", cfg.letterGreeting);
  setText("letterSignature", cfg.letterSignature);
  setText("letterSignatureName", cfg.letterSignatureName);
  const lp = document.getElementById("letterParagraphs");
  lp.innerHTML = "";
  safeText(cfg.letterBody).split(/\n\s*\n/).forEach(t => {
    if (!t.trim()) return;
    const p = document.createElement("p");
    p.textContent = t;
    lp.appendChild(p);
  });

  setText("whenTitle", cfg.whenTitle);
  setText("whenSubtitle", cfg.whenSubtitle);
  setText("whenHint", cfg.whenHint);

  setText("gameTitle", cfg.gameTitle);
  setText("gameSubtitle", cfg.gameSubtitle);
  setText("gameStartText", cfg.gameSubtitle);
  setText("gameStartBtn", cfg.gameStart);
  gameState.target = parseInt(cfg.gameTarget) || 10;
  setText("targetValue", String(gameState.target));

  setText("confirmEyebrow", cfg.finalEyebrow);
  setText("finalTitle", cfg.finalTitle);
  setText("finalBody", cfg.finalBody);
  setText("confirmFrom", cfg.fromName);
  setText("finalFooter", cfg.finalFooter);
  setText("finalBtnText", cfg.finalButton);

  const venueRow = document.getElementById("venueRow");
  if (venueRow) {
    if (cfg.finalVenue && String(cfg.finalVenue).trim()) {
      venueRow.style.display = "flex";
      setText("confirmVenue", cfg.finalVenue);
    } else {
      venueRow.style.display = "none";
    }
  }

  setupMusic(cfg);
  buildBgHearts();
}

/* ============================================================
   BACKGROUND HEARTS
   ============================================================ */
function buildBgHearts() {
  const layer = document.getElementById("bgHearts");
  if (!layer) return;
  layer.innerHTML = "";
  const glyphs = ["♥", "♡", "❥", "💕", "💗"];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement("span");
    el.textContent = glyphs[i % glyphs.length];
    el.style.left = (Math.random() * 100) + "%";
    el.style.fontSize = (16 + Math.random() * 20) + "px";
    const dur = 12 + Math.random() * 12;
    el.style.animationDuration = dur + "s";
    el.style.animationDelay = (-Math.random() * dur) + "s";
    layer.appendChild(el);
  }
}

/* ============================================================
   MUSIC — supports uploaded URL from songSrc
   ============================================================ */
function setupMusic(cfg) {
  const music = document.getElementById("music");
  const btn = document.getElementById("musicBtn");
  if (!music || !btn) return;

  // ✅ Use uploaded song URL (cfg.songSrc). Hide if disabled or missing.
  const src = (cfg.songEnabled === "yes" && cfg.songSrc) ? String(cfg.songSrc) : "";

  if (!src) {
    btn.style.display = "none";
    music.removeAttribute("src");
    music.innerHTML = "";
    return;
  }

  btn.style.display = "";
  music.innerHTML = "";

  // Detect type from extension (fallback: audio/mpeg)
  let type = "audio/mpeg";
  if (/\.m4a$/i.test(src)) type = "audio/mp4";
  else if (/\.ogg$/i.test(src)) type = "audio/ogg";
  else if (/\.wav$/i.test(src)) type = "audio/wav";

  const source = document.createElement("source");
  source.src = src;
  source.type = type;
  music.appendChild(source);
  music.load();

  btn.onclick = () => {
    if (music.paused) {
      music.play().then(() => btn.classList.add("playing"))
        .catch(() => {});
    } else {
      music.pause();
      btn.classList.remove("playing");
    }
  };

  // Auto-start on first interaction (browsers block autoplay otherwise)
  const tryAutoplay = () => {
    if (musicStarted) return;
    musicStarted = true;
    music.volume = 0.6;
    music.play().then(() => btn.classList.add("playing")).catch(() => {});
  };
  document.body.addEventListener("click", tryAutoplay, { once: true });
  document.body.addEventListener("touchstart", tryAutoplay, { once: true, passive: true });
}

/* ============================================================
   PAGE NAVIGATION
   ============================================================ */
function goTo(n) {
  if (n === currentPage) return;
  const cur = document.getElementById("page" + currentPage);
  const next = document.getElementById("page" + n);
  if (!next) return;
  cur.classList.remove("active");
  next.classList.add("active");
  currentPage = n;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (n === 4) resetGameUI();
  if (n === 5) { updateConfirmDetails(); celebrate(); }
}

/* ============================================================
   PAGE 1 — SAY YES / NO
   ============================================================ */
function sayYes() {
  celebrate();
  setTimeout(() => goTo(2), 600);
}

function runAway(btn) {
  if (!btn) return;
  const x = (Math.random() - 0.5) * 240;
  const y = (Math.random() - 0.5) * 100;
  btn.style.transform = `translate(${x}px, ${y}px)`;
  const msgs = ["Nope!", "Try again!", "Not today!", "Can't catch me!", "Nuh-uh ♥", "Please? 🥺"];
  const span = btn.querySelector("span");
  if (span) span.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  setTimeout(() => { btn.style.transform = ""; }, 1500);
}

/* ============================================================
   PAGE 3 — DATE & TIME
   ============================================================ */
function confirmDateTime() {
  const dateEl = document.getElementById("dateInput");
  const timeEl = document.getElementById("timeInput");
  if (!dateEl.value) { alert("Pick a day first ♥"); dateEl.focus(); return; }
  if (!timeEl.value) { alert("Pick a time first ♥"); timeEl.focus(); return; }
  selectedDate = dateEl.value;
  selectedTime = timeEl.value;
  goTo(4);
}

function updateConfirmDetails() {
  const dateEl = document.getElementById("confirmDate");
  const timeEl = document.getElementById("confirmTime");

  if (selectedDate) {
    const d = new Date(selectedDate + "T00:00:00");
    if (!isNaN(d.getTime())) {
      dateEl.textContent = d.toLocaleDateString("en-IN", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
    } else {
      dateEl.textContent = selectedDate;
    }
  } else dateEl.textContent = "To be decided";

  if (selectedTime) {
    const [h, m] = selectedTime.split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    timeEl.textContent = d.toLocaleTimeString("en-IN", {
      hour: "numeric", minute: "2-digit", hour12: true
    });
  } else timeEl.textContent = "To be decided";
}

/* ============================================================
   PAGE 4 — GAME  (mobile-optimised: faster spawns, better taps)
   ============================================================ */
const GAME_DURATION = 30;      // seconds
const MIN_SPAWN_GAP  = 220;    // ms between heart spawns (was 700)
const MAX_SPAWN_GAP  = 420;

function resetGameUI() {
  const arena = document.getElementById("gameArena");
  arena.querySelectorAll(".falling-heart").forEach(el => el.remove());
  document.getElementById("gameStartOverlay").style.display = "flex";
  document.getElementById("scoreValue").textContent = "0";
  document.getElementById("timeValue").textContent = String(GAME_DURATION);
  document.getElementById("gameStatus").textContent = "";
  document.getElementById("gameAfter").style.display = "none";
  gameState.active = false;
  gameState.score = 0;
  gameState.timeLeft = GAME_DURATION;
  clearInterval(gameState.spawnTimer);
  clearInterval(gameState.tickTimer);
}

/* ✅ Adaptive spawn: hearts spawn fast enough to hit the target
   even on mobile. More target → tighter spawn gap. */
function getSpawnInterval() {
  const target = Math.max(3, gameState.target || 10);
  // Give roughly target*2.2 spawns in 30s → plenty of margin
  const idealMs = (GAME_DURATION * 1000) / (target * 2.2);
  const clamped = Math.max(MIN_SPAWN_GAP, Math.min(MAX_SPAWN_GAP, idealMs));
  return clamped;
}

function startGame() {
  resetGameUI();
  document.getElementById("gameStartOverlay").style.display = "none";
  gameState.active = true;
  gameState.score = 0;
  gameState.timeLeft = GAME_DURATION;

  gameState.tickTimer = setInterval(() => {
    gameState.timeLeft--;
    document.getElementById("timeValue").textContent = String(Math.max(0, gameState.timeLeft));
    if (gameState.timeLeft <= 0) endGame(false);
  }, 1000);

  // ✅ Spawn loop — variable timing so it's not metronomic
  const spawnLoop = () => {
    if (!gameState.active) return;
    spawnHeart();
    const base = getSpawnInterval();
    const jitter = base * (0.6 + Math.random() * 0.8);
    gameState.spawnTimer = setTimeout(spawnLoop, jitter);
  };
  spawnLoop();
  // Seed a couple of hearts immediately so mobile users don't wait
  spawnHeart();
  setTimeout(spawnHeart, 150);
}

function spawnHeart() {
  if (!gameState.active) return;
  const arena = document.getElementById("gameArena");
  const rect = arena.getBoundingClientRect();
  if (!rect.width) return;

  const heart = document.createElement("div");
  heart.className = "falling-heart";
  heart.textContent = ["💕", "💖", "💗", "❤️", "💘", "💝"][Math.floor(Math.random() * 6)];

  // ✅ Larger tap target on mobile (44px minimum)
  const isMobile = window.matchMedia("(max-width: 600px)").matches;
  heart.style.fontSize = isMobile ? "40px" : "34px";
  heart.style.padding = isMobile ? "10px" : "4px";
  heart.style.boxSizing = "border-box";
  heart.style.display = "grid";
  heart.style.placeItems = "center";

  const size = isMobile ? 60 : 50;
  const x = Math.random() * Math.max(10, rect.width - size);
  heart.style.left = x + "px";
  heart.style.top = "-" + size + "px";

  // ✅ Slightly faster fall on mobile so hearts reach the tap zone
  const fallDuration = isMobile
    ? 2600 + Math.random() * 1800
    : 3000 + Math.random() * 2500;
  heart.style.transition = `top ${fallDuration}ms linear`;

  // ✅ Use pointerdown (single event, no tap delay) — covers mouse + touch
  let caught = false;
  const onCatch = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (caught) return;
    caught = true;
    catchHeart(heart);
  };
  if (window.PointerEvent) {
    heart.addEventListener("pointerdown", onCatch, { passive: false });
  } else {
    heart.addEventListener("touchstart", onCatch, { passive: false });
    heart.addEventListener("mousedown", onCatch);
  }

  arena.appendChild(heart);
  requestAnimationFrame(() => { heart.style.top = (rect.height + size) + "px"; });

  setTimeout(() => {
    if (heart.parentNode && !heart.classList.contains("caught")) heart.remove();
  }, fallDuration + 100);
}

function catchHeart(heart) {
  if (!gameState.active || heart.classList.contains("caught")) return;
  heart.classList.add("caught");
  gameState.score++;
  document.getElementById("scoreValue").textContent = String(gameState.score);
  setTimeout(() => heart.remove(), 500);
  if (gameState.score >= gameState.target) endGame(true);
}

function endGame(won) {
  gameState.active = false;
  clearInterval(gameState.spawnTimer);
  clearTimeout(gameState.spawnTimer);
  clearInterval(gameState.tickTimer);
  document.getElementById("gameArena").querySelectorAll(".falling-heart").forEach(el => el.remove());
  const status = document.getElementById("gameStatus");
  status.textContent = won ? CONFIG.gameWin : CONFIG.gameLose;
  if (won) {
    document.getElementById("gameAfter").style.display = "block";
    celebrate();
  } else {
    document.getElementById("gameStartOverlay").style.display = "flex";
    document.getElementById("gameStartBtn").textContent = "Try again ♥";
  }
}

/* ============================================================
   CONFETTI
   ============================================================ */
function celebrate() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const emojis = ["💕", "💖", "❤️", "✨", "💗", "🌸"];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "%";
    c.style.top = "-20px";
    c.style.fontSize = (16 + Math.random() * 16) + "px";
    c.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    c.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

/* ============================================================
   RESTART
   ============================================================ */
function restartAll() {
  resetGameUI();
  selectedDate = "";
  selectedTime = "";
  const dateEl = document.getElementById("dateInput");
  const timeEl = document.getElementById("timeInput");
  if (dateEl) dateEl.value = "";
  if (timeEl) timeEl.value = "";
  goTo(1);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  CONFIG = defaults();
  render(CONFIG);

  // ✅ Load user customizations from the gift link
  const userCfg = await loadUserConfig();
  if (userCfg) {
    CONFIG = { ...defaults(), ...userCfg };
    render(CONFIG);
  }

  // ✅ Editor live preview (unchanged)
  window.addEventListener("message", (event) => {
    if (event.origin !== window.location.origin) return;
    const msg = event.data || {};
    if (msg.type === "NIVA_PREVIEW_UPDATE" && msg.data) {
      CONFIG = { ...defaults(), ...msg.data };
      render(CONFIG);
    }
    if (msg.type === "NIVA_PREVIEW_PING") {
      try { window.parent.postMessage({ type: "NIVA_PREVIEW_READY" }, window.location.origin); } catch {}
    }
  });

  // Tell the editor iframe we're ready
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "NIVA_PREVIEW_READY" }, window.location.origin);
    }
  } catch {}
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot, { once: true });
} else {
  boot();
}
</script>
