<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Souls, One Moon</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #101522;
    --bg2: #1a2034;
    --text: #f8edf2;
    --muted: #c8bdcb;
    --accent: #e8a9c2;
    --accent2: #b7a8e8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
        radial-gradient(ellipse at 15% 15%, #b7a8e833, transparent 42%),
        radial-gradient(ellipse at 85% 75%, #e8a9c233, transparent 45%),
        linear-gradient(145deg, var(--bg), var(--bg2));
}

#sky {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
    to {
        opacity: .15;
        transform: scale(.5);
    }
}

.page {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 60px 22px 110px;
}

.page.active {
    display: flex;
    animation: pageIn 1s ease;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.wrap {
    width: min(100%, 950px);
    margin: auto;
    text-align: center;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}

h1 {
    font: 400 clamp(42px, 7vw, 80px)/1.1 'Playfair Display', serif;
    margin: 20px 0;
}

h2 {
    font: 400 clamp(30px, 5vw, 48px) 'Playfair Display', serif;
}

.script {
    font-family: 'Caveat', cursive;
}

.lead {
    max-width: 650px;
    margin: 20px auto;
    color: var(--muted);
    line-height: 1.9;
}

.accent {
    color: var(--accent);
}

button {
    cursor: pointer;
    font-family: inherit;
}

.primary {
    border: none;
    border-radius: 50px;
    padding: 14px 30px;
    color: white;
    font-weight: 600;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    transition: .3s;
}

.primary:hover {
    transform: translateY(-4px);
}

.advance {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: .5s;
}

.advance.visible {
    opacity: 1;
    pointer-events: auto;
}

.music-toggle {
    position: fixed;
    right: 20px;
    top: 18px;
    z-index: 30;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #ffffff30;
    background: #15192dcc;
    color: white;
    font-size: 21px;
}

.music-toggle.playing {
    box-shadow: 0 0 25px var(--accent);
}

/* WELCOME */

.cover-moon {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    margin: 35px auto;
    background:
        radial-gradient(circle at 35% 30%, #fff9e9, #d0c7b9 45%, #777781 100%);
    box-shadow: 0 0 75px #c9b6ff55;
    animation: moonFloat 7s infinite ease-in-out;
    position: relative;
}

@keyframes moonFloat {
    50% {
        transform: translateY(-13px);
    }
}

/* LETTER */

.letter-paper {
    max-width: 700px;
    margin: 30px auto;
    padding: 45px;
    background: #f6eddd;
    color: #493d3c;
    text-align: left;
    border-radius: 4px;
}

.letter-paper h2 {
    font-family: 'Caveat', cursive;
    color: #865b69;
}

.letter-paper p {
    font: 25px/1.6 'Caveat', cursive;
    white-space: pre-line;
}

/* MOON */

.moon-layout {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    max-width: 750px;
    margin: 35px auto;
}

.moon-card {
    background: #ffffff0d;
    border: 1px solid #ffffff20;
    border-radius: 20px;
    padding: 20px;
}

.moon-canvas {
    width: 100%;
    max-width: 200px;
    display: block;
    margin: auto;
}

.moon-label {
    font: 25px 'Playfair Display', serif;
    color: var(--accent);
}

.moon-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
}

/* MEMORIES */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    margin: 35px auto;
    text-align: left;
}

.memory {
    background: #ffffff0d;
    border: 1px solid #ffffff20;
    border-radius: 15px;
    overflow: hidden;
}

.memory img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.memory-caption {
    padding: 15px;
}

.memory-caption h3 {
    font: 22px 'Playfair Display', serif;
}

.memory-caption p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.7;
}

/* TIMELINE */

.timeline {
    max-width: 650px;
    margin: 35px auto;
    text-align: left;
    position: relative;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 12px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(var(--accent), var(--accent2));
}

.moment {
    position: relative;
    padding: 0 0 30px 45px;
}

.moment::before {
    content: "❤";
    position: absolute;
    left: 3px;
    color: var(--accent);
}

.moment time {
    color: var(--accent);
    font-size: 11px;
}

.moment h3 {
    font: 25px 'Playfair Display', serif;
    margin: 8px 0;
}

.moment p {
    color: var(--muted);
    line-height: 1.7;
}

/* GAME */

.game {
    max-width: 600px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff10;
    border-radius: 20px;
}

.game-option {
    display: block;
    width: 100%;
    margin: 12px 0;
    padding: 15px;
    border-radius: 12px;
    background: #ffffff12;
    color: white;
    border: 1px solid #ffffff25;
    text-align: left;
}

.game-option:hover {
    background: #e8a9c233;
}

/* FINAL WISH */

.gift {
    font-size: 110px;
    cursor: pointer;
    animation: moonFloat 3s infinite;
}

.wish {
    display: none;
    max-width: 650px;
    margin: 30px auto;
    padding: 35px;
    background: #ffffff10;
    border: 1px solid #ffffff25;
    border-radius: 20px;
    line-height: 2;
}

.wish.show {
    display: block;
    animation: pageIn 1s;
}

@media(max-width:600px) {
    .moon-layout {
        grid-template-columns: 1fr;
    }

    .letter-paper {
        padding: 25px;
    }

    .music-toggle {
        right: 12px;
        top: 12px;
    }
}

</style>
</head>

<body>

<div id="sky"></div>

<button class="music-toggle" id="musicToggle">♫</button>

<audio id="backgroundMusic" loop></audio>

<main id="site"></main>
<script>
/* =========================================================
   NIVA COUPLE GIFT TEMPLATE
   All gift content is loaded from config.json.
========================================================= */

let CONFIG = {};
let currentPage = 0;
let musicStarted = false;

const site = document.getElementById("site");
const music = document.getElementById("backgroundMusic");
const musicToggle = document.getElementById("musicToggle");

const escapeHTML = (value = "") =>
  String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);

const safeURL = (value = "") => {
  const url = String(value).trim();
  if (/^(https?:\/\/|\.{0,2}\/|assets\/)/i.test(url)) return url;
  return "";
};

function getTheme() {
  const theme = CONFIG.theme || {};
  const root = document.documentElement;

  root.style.setProperty("--bg", theme.background || "#100d19");
  root.style.setProperty("--bg2", theme.backgroundSecondary || "#21152b");
  root.style.setProperty("--text", theme.text || "#fff5f7");
  root.style.setProperty("--muted", theme.muted || "#c8b7c8");
  root.style.setProperty("--accent", theme.accent || "#e99ab5");
  root.style.setProperty("--accent2", theme.accentSecondary || "#c8a3ef");
}

function buttonNext(label = "Continue") {
  return `
    <button class="primary advance" type="button">
      ${escapeHTML(label)} <span aria-hidden="true">→</span>
    </button>
  `;
}

function createPage(content, extraClass = "") {
  const page = document.createElement("section");
  page.className = `page ${extraClass}`;
  page.innerHTML = content;
  site.appendChild(page);
  return page;
}

/* ---------------------------------------------------------
   DATE AND MOON PHASE CALCULATION
   Uses the synodic month to estimate the phase on a date.
--------------------------------------------------------- */

function getMoonPhase(dateString) {
  const date = new Date(`${dateString}T12:00:00Z`);

  if (Number.isNaN(date.getTime())) {
    return { name: "Moon phase unavailable", illumination: 0.5, age: 0 };
  }

  // Known approximate new moon: 6 January 2000, 18:14 UTC.
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const synodicMonth = 29.530588853 * 24 * 60 * 60 * 1000;

  let age = ((date.getTime() - knownNewMoon) % synodicMonth + synodicMonth) % synodicMonth;
  age = age / (24 * 60 * 60 * 1000);

  const phase = age / 29.530588853;
  const illumination = (1 - Math.cos(phase * 2 * Math.PI)) / 2;

  let name;

  if (age < 1.85 || age > 27.68) name = "New Moon";
  else if (age < 5.54) name = "Waxing Crescent";
  else if (age < 9.23) name = "First Quarter";
  else if (age < 12.92) name = "Waxing Gibbous";
  else if (age < 16.61) name = "Full Moon";
  else if (age < 20.30) name = "Waning Gibbous";
  else if (age < 23.99) name = "Last Quarter";
  else name = "Waning Crescent";

  return { name, illumination, age, phase };
}

/* ---------------------------------------------------------
   MOON RENDERING
   Draws a spherical moon with craters and a date-based
   illuminated surface. This is a visual rendering, not a
   NASA photograph or precision astronomical ephemeris.
--------------------------------------------------------- */

function drawMoon(canvas, dateString, seed = 1) {
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const size = canvas.width;
  const center = size / 2;
  const radius = size * 0.40;

  ctx.clearRect(0, 0, size, size);

  const moon = getMoonPhase(dateString);
  const phaseAngle = (moon.phase || 0) * Math.PI * 2;

  // Draw a softly glowing background.
  const glow = ctx.createRadialGradient(center, center, radius * 0.5, center, center, radius * 1.5);
  glow.addColorStop(0, "rgba(255,240,220,0.15)");
  glow.addColorStop(1, "rgba(255,240,220,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, size, size);

  // Moon sphere.
  ctx.save();
  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);
  ctx.clip();

  const base = ctx.createRadialGradient(
    center - radius * 0.28,
    center - radius * 0.32,
    radius * 0.08,
    center,
    center,
    radius
  );
  base.addColorStop(0, "#f3eee1");
  base.addColorStop(0.55, "#b9b4a9");
  base.addColorStop(1, "#68666a");

  ctx.fillStyle = base;
  ctx.fillRect(center - radius, center - radius, radius * 2, radius * 2);

  // Subtle lunar surface texture.
  let randomSeed = seed * 92821 + 12345;

  function random() {
    randomSeed = (randomSeed * 16807) % 2147483647;
    return (randomSeed - 1) / 2147483646;
  }

  for (let i = 0; i < 65; i++) {
    const angle = random() * Math.PI * 2;
    const distance = Math.sqrt(random()) * radius * 0.91;
    const x = center + Math.cos(angle) * distance;
    const y = center + Math.sin(angle) * distance;
    const craterRadius = 2 + random() * radius * 0.075;

    ctx.beginPath();
    ctx.arc(x, y, craterRadius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(65,65,65,${0.035 + random() * 0.10})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - craterRadius * 0.18, y - craterRadius * 0.18,
      craterRadius * 0.78, Math.PI, Math.PI * 1.8);
    ctx.strokeStyle = "rgba(255,255,255,0.13)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Apply the phase lighting to the spherical surface.
  const image = ctx.getImageData(0, 0, size, size);
  const pixels = image.data;

  const sunX = Math.sin(phaseAngle);
  const sunZ = -Math.cos(phaseAngle);
  const sunY = 0.12;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (x - center) / radius;
      const dy = (y - center) / radius;
      const distanceSquared = dx * dx + dy * dy;

      if (distanceSquared > 1) continue;

      const dz = Math.sqrt(1 - distanceSquared);
      const dot = dx * sunX + dy * sunY + dz * sunZ;

      const index = (y * size + x) * 4;
      const brightness = Math.max(0.045, Math.min(1, 0.12 + Math.max(0, dot) * 0.88));

      pixels[index] *= brightness;
      pixels[index + 1] *= brightness;
      pixels[index + 2] *= brightness;
    }
  }

  ctx.putImageData(image, 0, 0);

  // Fine edge shading gives the sphere more depth.
  const edge = ctx.createRadialGradient(
    center - radius * 0.25,
    center - radius * 0.28,
    radius * 0.1,
    center,
    center,
    radius
  );
  edge.addColorStop(0, "rgba(255,255,255,0)");
  edge.addColorStop(0.78, "rgba(0,0,0,0.02)");
  edge.addColorStop(1, "rgba(0,0,0,0.35)");

  ctx.fillStyle = edge;
  ctx.fillRect(center - radius, center - radius, radius * 2, radius * 2);

  ctx.restore();

  // Crisp outer edge.
  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ---------------------------------------------------------
   PAGE 1 — WELCOME
--------------------------------------------------------- */

function buildWelcome() {
  const data = CONFIG.welcome || {};

  return createPage(`
    <div class="welcome-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "A little universe of us")}</div>

      <h1>${escapeHTML(data.title || "Our Story, Written in the Stars")}</h1>

      <p class="subtitle">
        ${escapeHTML(data.subtitle || "Some moments become memories. Some people become home.")}
      </p>

      <div class="welcome-names">
        ${escapeHTML(CONFIG.couple?.personOne || "You")}
        <span>✦</span>
        ${escapeHTML(CONFIG.couple?.personTwo || "Me")}
      </div>

      <div class="welcome-decoration" aria-hidden="true">♡</div>

      ${buttonNext(data.buttonText || "Open our story")}
    </div>
  `, "welcome-page");
}

/* ---------------------------------------------------------
   PAGE 2 — HANDWRITTEN LETTER
--------------------------------------------------------- */

function buildLetter() {
  const data = CONFIG.letter || {};

  const paragraphs = (data.paragraphs || [
    "There are so many things I wish I could tell you, and sometimes words still feel too small.",
    "You have become a beautiful part of my everyday life. Even the simplest moments feel special when they have you in them.",
    "If I could keep one thing forever, it would be the feeling of being able to share this life with you."
  ]);

  return createPage(`
    <div class="letter-page-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "A letter from my heart")}</div>

      <div class="letter-paper">
        <h2>${escapeHTML(data.heading || "To My Favourite Person")}</h2>

        <div class="handwritten-letter">
          ${paragraphs.map(p => `<p>${escapeHTML(p)}</p>`).join("")}
        </div>

        <p class="letter-signature">
          ${escapeHTML(data.signoff || "With all my love,")}
          <br>
          <strong>${escapeHTML(data.senderName || CONFIG.couple?.personOne || "Forever yours")}</strong>
        </p>
      </div>

      ${buttonNext(data.buttonText || "There's something written in the moon")}
    </div>
  `, "letter-page");
}

/* ---------------------------------------------------------
   PAGE 3 — BIRTHDAY MOONS
--------------------------------------------------------- */

function buildMoonPage() {
  const couple = CONFIG.couple || {};
  const moonData = CONFIG.moon || {};

  const personOneDate = couple.personOneDOB || "2000-01-01";
  const personTwoDate = couple.personTwoDOB || "2000-06-01";

  const firstMoon = getMoonPhase(personOneDate);
  const secondMoon = getMoonPhase(personTwoDate);

  return createPage(`
    <div class="moon-page-content">
      <div class="eyebrow">${escapeHTML(moonData.eyebrow || "Written in the universe")}</div>

      <h2>${escapeHTML(moonData.heading || "Two Birthdays. Two Moons. One Story.")}</h2>

      <p class="subtitle">
        ${escapeHTML(moonData.description || "The moon was in a different phase on each of your birthdays. Here's what the sky looked like on those dates.")}
      </p>

      <div class="moon-pair">
        <div class="moon-card">
          <canvas class="moon-canvas" width="320" height="320" data-moon="one"></canvas>
          <h3>${escapeHTML(couple.personOne || "Person One")}</h3>
          <p>${escapeHTML(personOneDate)}</p>
          <strong>${escapeHTML(firstMoon.name)}</strong>
          <small>${Math.round(firstMoon.illumination * 100)}% illuminated</small>
        </div>

        <div class="moon-card">
          <canvas class="moon-canvas" width="320" height="320" data-moon="two"></canvas>
          <h3>${escapeHTML(couple.personTwo || "Person Two")}</h3>
          <p>${escapeHTML(personTwoDate)}</p>
          <strong>${escapeHTML(secondMoon.name)}</strong>
          <small>${Math.round(secondMoon.illumination * 100)}% illuminated</small>
        </div>
      </div>

      <div class="moon-message">
        ${escapeHTML(moonData.message || "Two different nights, two different skies — and somehow, your stories found a way to meet.")}
      </div>

      <div class="combined-moon">
        <canvas class="full-moon-canvas" width="360" height="360"></canvas>
        <h3>${escapeHTML(moonData.combinedHeading || "A little universe of our own")}</h3>
        <p>${escapeHTML(moonData.combinedMessage || "Not a scientific moon phase — just a symbol of two lives sharing one beautiful sky.")}</p>
      </div>

      ${buttonNext(moonData.buttonText || "Let's revisit our memories")}
    </div>
  `, "moon-page");
}

/* ---------------------------------------------------------
   PAGE 4 — PHOTO ALBUM
--------------------------------------------------------- */

function buildAlbumPage() {
  const data = CONFIG.album || {};
  const photos = data.photos || [];

  return createPage(`
    <div class="album-page-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "Little pieces of forever")}</div>
      <h2>${escapeHTML(data.heading || "Our Memory Album")}</h2>
      <p class="subtitle">${escapeHTML(data.description || "Every picture holds a moment we never want to lose.")}</p>

      <div class="album-grid">
        ${photos.map((photo, index) => {
          const src = safeURL(photo.src || "");
          if (!src) return "";

          return `
            <figure class="album-item">
              <img src="${escapeHTML(src)}"
                   alt="${escapeHTML(photo.alt || "A special memory")}"
                   loading="lazy">
              <figcaption>${escapeHTML(photo.caption || `Memory ${index + 1}`)}</figcaption>
            </figure>
          `;
        }).join("")}
      </div>

      ${photos.length ? "" : `<p class="empty-message">Our favourite memories will live here.</p>`}

      ${buttonNext(data.buttonText || "See how our story unfolded")}
    </div>
  `, "album-page");
}

/* ---------------------------------------------------------
   PAGE 5 — TIMELINE
--------------------------------------------------------- */

function buildTimelinePage() {
  const data = CONFIG.timeline || {};
  const events = data.events || [];

  return createPage(`
    <div class="timeline-page-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "Every chapter matters")}</div>
      <h2>${escapeHTML(data.heading || "Our Little Timeline")}</h2>
      <p class="subtitle">${escapeHTML(data.description || "From the first hello to all the moments that followed.")}</p>

      <div class="timeline">
        ${events.map((event, index) => `
          <article class="timeline-item">
            <div class="timeline-marker">${escapeHTML(event.icon || "♡")}</div>
            <div class="timeline-card">
              <small>${escapeHTML(event.date || "")}</small>
              <h3>${escapeHTML(event.title || `Chapter ${index + 1}`)}</h3>
              <p>${escapeHTML(event.description || "")}</p>
              ${event.image && safeURL(event.image) ? `
                <img src="${escapeHTML(safeURL(event.image))}"
                     alt="${escapeHTML(event.title || "Timeline memory")}"
                     loading="lazy">
              ` : ""}
            </div>
          </article>
        `).join("")}
      </div>

      ${events.length ? "" : `<p class="empty-message">Our story is still being written.</p>`}

      ${buttonNext(data.buttonText || "One little game before the final page")}
    </div>
  `, "timeline-page");
}

/* ---------------------------------------------------------
   PAGE 6 — COUPLE GAME
--------------------------------------------------------- */

function buildGamePage() {
  const game = CONFIG.game || {};
  const questions = game.questions || [];

  const firstQuestion = questions[0] || {
    question: "Which little moment would we choose to relive?",
    options: [
      "Our first conversation",
      "Our funniest memory",
      "A simple day together"
    ],
    answer: 0,
    success: "Every little moment matters when it's with the right person."
  };

  return createPage(`
    <div class="game-page-content">
      <div class="eyebrow">${escapeHTML(game.eyebrow || "A tiny test of our story")}</div>
      <h2>${escapeHTML(game.heading || "How Well Do You Know Us?")}</h2>
      <p class="subtitle">${escapeHTML(game.description || "A little game made from the memories we share.")}</p>

      <div class="game-card">
        <div class="game-progress" id="gameProgress">Question 1 of ${questions.length || 1}</div>
        <h3 id="gameQuestion">${escapeHTML(firstQuestion.question)}</h3>
        <div id="gameOptions" class="game-options">
          ${firstQuestion.options.map((option, index) => `
            <button class="game-option" type="button" data-option="${index}">
              ${escapeHTML(option)}
            </button>
          `).join("")}
        </div>
        <p id="gameFeedback" class="game-feedback" aria-live="polite"></p>
      </div>

      ${buttonNext(game.buttonText || "One last thing")}
    </div>
  `, "game-page");
}

/* ---------------------------------------------------------

--------------------------------------------------------- */

function buildWebsite() {
  site.innerHTML = "";

  buildWelcome();
  buildLetter();
  buildMoonPage();
  buildAlbumPage();
  buildTimelinePage();
  buildGamePage();
  buildFinalPage();

  const pages = [...site.querySelectorAll(".page")];

  pages.forEach((page, index) => {
    page.dataset.pageIndex = index;
  });

  // Render the two date-based moon phases.
  const moonOne = site.querySelector('[data-moon="one"]');
  const moonTwo = site.querySelector('[data-moon="two"]');
  const fullMoon = site.querySelector(".full-moon-canvas");

  drawMoon(moonOne, CONFIG.couple?.personOneDOB || "2000-01-01", 1);
  drawMoon(moonTwo, CONFIG.couple?.personTwoDOB || "2000-06-01", 2);

  // A symbolic full moon for the combined page.
  drawMoon(fullMoon, "2000-01-21", 3);

  setupPageNavigation(pages);
  setupCoupleGame();
}

/* ---------------------------------------------------------
   PAGE NAVIGATION
   No permanent navigation bar or page dots.
   Continue button appears after the page has been explored.
--------------------------------------------------------- */

function setupPageNavigation(pages) {
  const delay = Number(CONFIG.behaviour?.nextButtonDelay || 6500);

  pages.forEach((page, index) => {
    const nextButton = page.querySelector(".advance");

    if (!nextButton) return;

    nextButton.style.display = index === pages.length - 1 ? "none" : "";

    nextButton.addEventListener("click", () => {
      showPage(index + 1);
    });
  });

  showPage(0);

  function revealButton(page) {
    const button = page.querySelector(".advance");
    if (button) button.classList.add("visible");
  }

  pages.forEach(page => {
    const button = page.querySelector(".advance");
    if (!button) return;

    // Reveal after a short reading/exploration period.
    setTimeout(() => revealButton(page), delay);

    // Also reveal when the visitor reaches the lower part of the page.
    page.addEventListener("scroll", () => {
      if (page.scrollTop + page.clientHeight >= page.scrollHeight - 100) {
        revealButton(page);
      }
    });
  });
}

function showPage(index) {
  const pages = [...site.querySelectorAll(".page")];

  if (index < 0 || index >= pages.length) return;

  currentPage = index;

  pages.forEach((page, i) => {
    page.classList.toggle("active", i === index);
  });

  // Restart the reveal timer whenever a page is opened.
  const page = pages[index];
  const button = page.querySelector(".advance");

  if (button) {
    button.classList.remove("visible");

    const delay = Number(CONFIG.behaviour?.nextButtonDelay || 6500);

    setTimeout(() => {
      if (currentPage === index) button.classList.add("visible");
    }, delay);
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------------------------------------------------------
   GAME LOGIC
--------------------------------------------------------- */

function setupCoupleGame() {
  const questions = CONFIG.game?.questions || [];
  let questionIndex = 0;
  let score = 0;

  const questionElement = document.getElementById("gameQuestion");
  const optionsElement = document.getElementById("gameOptions");
  const feedbackElement = document.getElementById("gameFeedback");
  const progressElement = document.getElementById("gameProgress");

  if (!questionElement || !optionsElement || !feedbackElement) return;

  if (!questions.length) {
    questionElement.textContent = "The best part of this story is that it belongs to us.";
    optionsElement.innerHTML = "";
    feedbackElement.textContent = "♡";
    return;
  }

  function showQuestion() {
    const question = questions[questionIndex];

    progressElement.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
    questionElement.textContent = question.question || "";

    feedbackElement.textContent = "";

    optionsElement.innerHTML = (question.options || []).map((option, index) => `
      <button class="game-option" type="button" data-option="${index}">
        ${escapeHTML(option)}
      </button>
    `).join("");

    optionsElement.querySelectorAll(".game-option").forEach(button => {
      button.addEventListener("click", () => {
        const selected = Number(button.dataset.option);
        const correct = Number(question.answer);

        optionsElement.querySelectorAll("button").forEach(b => {
          b.disabled = true;
        });

        if (selected === correct) {
          score++;
          feedbackElement.textContent = question.success || "You got it! ♡";
        } else {
          feedbackElement.textContent = question.wrong || "That's okay. Every answer is part of our story. ♡";
        }

        setTimeout(() => {
          questionIndex++;

          if (questionIndex < questions.length) {
            showQuestion();
          } else {
            questionElement.textContent = gameFinishedHeading();
            optionsElement.innerHTML = "";
            progressElement.textContent = "Our little game is complete";
            feedbackElement.textContent =
              `${score} out of ${questions.length} — ${CONFIG.game?.endingMessage || "The real prize is the memories we share. ♡"}`;
          }
        }, 1400);
      });
    });
  }

  function gameFinishedHeading() {
    return CONFIG.game?.finishedHeading || "And that's our little story!";
  }

  showQuestion();
}

/* ---------------------------------------------------------
   MUSIC
   The template tries autoplay. Browsers may block audio
   until the visitor interacts with the page.
--------------------------------------------------------- */

function setupMusic() {
  const song = CONFIG.song || {};

  if (!music || !musicToggle) return;

  const source = safeURL(song.src || "");

  if (!source) {
    musicToggle.style.display = "none";
    return;
  }

  music.src = source;
  music.loop = song.loop !== false;
  music.volume = Math.min(1, Math.max(0, Number(song.volume ?? 0.65)));

  musicToggle.setAttribute("aria-label", "Mute or unmute music");
  musicToggle.textContent = "♫";

  async function tryPlay() {
    try {
      await music.play();
      musicStarted = true;
      musicToggle.classList.remove("muted");
      musicToggle.textContent = "♫";
    } catch (error) {
      musicStarted = false;
      musicToggle.classList.add("muted");
      musicToggle.textContent = "♪";
    }
  }

  // Attempt autoplay when the gift opens.
  tryPlay();

  // Browser may allow playback after the first visitor interaction.
  const startAfterInteraction = () => {
    if (!musicStarted) tryPlay();
  };

  document.addEventListener("pointerdown", startAfterInteraction, { once: true });
  document.addEventListener("keydown", startAfterInteraction, { once: true });

  musicToggle.addEventListener("click", async () => {
    if (music.paused) {
      await tryPlay();
    } else {
      music.pause();
      musicToggle.classList.add("muted");
      musicToggle.textContent = "♪";
    }
  });
}

/* ---------------------------------------------------------
   LOAD CONFIGURATION
--------------------------------------------------------- */

async function initNivaGift() {
  try {
    const response = await fetch("./config.json", { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Could not load config.json");
    }

    CONFIG = await response.json();

    getTheme();
    buildWebsite();
    setupMusic();

    document.title = CONFIG.siteTitle || "Our Little Story";
  } catch (error) {
    console.error(error);

    site.innerHTML = `
      <section class="page active">
        <div class="welcome-content">
          <h2>Something went wrong</h2>
          <p>Please check that config.json is in the same folder as template.html.</p>
        </div>
      </section>
    `;
  }
}

initNivaGift();
