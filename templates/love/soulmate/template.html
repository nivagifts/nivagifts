<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Souls, One Moon</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #101522;
    --bg2: #1a2034;
    --text: #f8edf2;
    --muted: #c8bdcb;
    --accent: #e8a9c2;
    --accent2: #b7a8e8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
        radial-gradient(ellipse at 15% 15%, #b7a8e833, transparent 42%),
        radial-gradient(ellipse at 85% 75%, #e8a9c233, transparent 45%),
        linear-gradient(145deg, var(--bg), var(--bg2));
}

#sky { position: fixed; inset: 0; z-index: -2; pointer-events: none; }

.star {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: white;
    animation: twinkle 4s infinite alternate;
}

@keyframes twinkle { to { opacity: .15; transform: scale(.5); } }

.page {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 60px 22px 110px;
}

.page.active { display: flex; animation: pageIn 1s ease; }

@keyframes pageIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.wrap {
    width: min(100%, 950px);
    margin: auto;
    text-align: center;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
}

h1 { font: 400 clamp(42px, 7vw, 80px)/1.1 'Playfair Display', serif; margin: 20px 0; }
h2 { font: 400 clamp(30px, 5vw, 48px)/1.15 'Playfair Display', serif; margin-bottom: 12px; }
.script { font-family: 'Caveat', cursive; }

.lead, .subtitle {
    max-width: 650px;
    margin: 20px auto;
    color: var(--muted);
    line-height: 1.9;
}

.accent { color: var(--accent); }
button { cursor: pointer; font-family: inherit; }

.primary {
    border: none;
    border-radius: 50px;
    padding: 14px 30px;
    color: white;
    font-weight: 600;
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    transition: .3s;
}
.primary:hover { transform: translateY(-4px); }

.advance {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    transition: .5s;
    z-index: 20;
}
.advance.visible { opacity: 1; pointer-events: auto; }

.music-toggle {
    position: fixed;
    right: 20px; top: 18px;
    z-index: 30;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid #ffffff30;
    background: #15192dcc;
    color: white;
    font-size: 21px;
}
.music-toggle.playing { box-shadow: 0 0 25px var(--accent); }
.music-toggle.muted { opacity: 0.55; }

/* WELCOME */
.welcome-content { width: 100%; }
.welcome-names {
    font: 400 clamp(22px, 3.5vw, 34px) 'Playfair Display', serif;
    color: var(--accent);
    margin: 30px 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
}
.welcome-names span { color: var(--accent2); font-size: 0.7em; }
.welcome-decoration {
    font-size: 64px;
    color: var(--accent);
    margin: 10px 0 40px;
    animation: moonFloat 3s infinite ease-in-out;
}
.cover-moon {
    width: 190px; height: 190px;
    border-radius: 50%;
    margin: 35px auto;
    background: radial-gradient(circle at 35% 30%, #fff9e9, #d0c7b9 45%, #777781 100%);
    box-shadow: 0 0 75px #c9b6ff55;
    animation: moonFloat 7s infinite ease-in-out;
    position: relative;
}
@keyframes moonFloat { 50% { transform: translateY(-13px); } }

/* LETTER */
.letter-page-content { width: 100%; }
.letter-paper {
    max-width: 700px;
    margin: 30px auto;
    padding: 45px;
    background: #f6eddd;
    color: #493d3c;
    text-align: left;
    border-radius: 4px;
    box-shadow: 0 20px 50px #00000055;
}
.letter-paper h2 { font-family: 'Caveat', cursive; color: #865b69; margin-bottom: 18px; }
.handwritten-letter p { font: 25px/1.6 'Caveat', cursive; white-space: pre-line; margin-bottom: 12px; }
.letter-signature { font: 24px/1.5 'Caveat', cursive; margin-top: 25px; color: #865b69; }

/* MOON */
.moon-page-content { width: 100%; }
.moon-pair, .moon-layout {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    max-width: 750px;
    margin: 35px auto;
}
.moon-card {
    background: #ffffff0d;
    border: 1px solid #ffffff20;
    border-radius: 20px;
    padding: 22px;
    text-align: center;
}
.moon-canvas {
    width: 100%;
    max-width: 200px;
    display: block;
    margin: 0 auto 14px;
}
.moon-card h3 { font: 400 24px 'Playfair Display', serif; margin-bottom: 6px; }
.moon-card p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.moon-card strong { display: block; font: 400 20px 'Playfair Display', serif; color: var(--accent); margin-top: 8px; }
.moon-card small { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
.moon-message {
    max-width: 650px;
    margin: 20px auto;
    color: var(--muted);
    line-height: 1.9;
    font-style: italic;
}
.combined-moon {
    max-width: 600px;
    margin: 50px auto 0;
    text-align: center;
}
.full-moon-canvas { width: 100%; max-width: 300px; display: block; margin: 0 auto 20px; }
.combined-moon h3 { font: 400 26px 'Playfair Display', serif; margin-bottom: 10px; }
.combined-moon p { color: var(--muted); line-height: 1.8; }

/* ALBUM */
.album-page-content { width: 100%; }
.album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    margin: 35px auto;
    text-align: left;
}
.album-item {
    background: #ffffff0d;
    border: 1px solid #ffffff20;
    border-radius: 15px;
    overflow: hidden;
}
.album-item img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}
.album-item figcaption {
    padding: 15px;
    font: 400 18px 'Playfair Display', serif;
    color: var(--text);
}
.empty-message {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    margin: 40px 0;
}

/* TIMELINE */
.timeline-page-content { width: 100%; }
.timeline {
    max-width: 650px;
    margin: 35px auto;
    text-align: left;
    position: relative;
}
.timeline::before {
    content: "";
    position: absolute;
    left: 16px; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(var(--accent), var(--accent2));
}
.timeline-item {
    position: relative;
    padding: 0 0 30px 48px;
}
.timeline-marker {
    position: absolute;
    left: 0; top: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--accent);
}
.timeline-card {
    background: #ffffff0d;
    border: 1px solid #ffffff20;
    border-radius: 15px;
    padding: 18px 20px;
}
.timeline-card small { color: var(--accent); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.timeline-card h3 { font: 400 22px 'Playfair Display', serif; margin: 6px 0 8px; }
.timeline-card p { color: var(--muted); line-height: 1.7; font-size: 14px; }
.timeline-card img {
    width: 100%;
    margin-top: 12px;
    border-radius: 10px;
    max-height: 220px;
    object-fit: cover;
}

/* GAME */
.game-page-content { width: 100%; }
.game-card, .game {
    max-width: 600px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff10;
    border: 1px solid #ffffff20;
    border-radius: 20px;
    text-align: left;
}
.game-progress {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
}
.game-card h3, #gameQuestion {
    font: 400 clamp(20px, 3vw, 26px)/1.35 'Playfair Display', serif;
    margin-bottom: 18px;
}
.game-options, #gameOptions { display: flex; flex-direction: column; gap: 12px; }
.game-option {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: #ffffff12;
    color: white;
    border: 1px solid #ffffff25;
    text-align: left;
    font-size: 15px;
    transition: .2s;
}
.game-option:hover:not(:disabled) { background: #e8a9c233; }
.game-option:disabled { cursor: default; opacity: 0.75; }
.game-feedback {
    margin-top: 18px;
    min-height: 24px;
    color: var(--accent);
    font-style: italic;
}

/* FINAL */
.final-page-content { width: 100%; max-width: 650px; }
.final-heart {
    font-size: 90px;
    color: var(--accent);
    margin: 20px 0;
    animation: moonFloat 3s infinite ease-in-out;
}
.final-message {
    color: var(--muted);
    line-height: 2;
    margin: 25px auto;
    font-size: 16px;
}
.final-signature { font: 28px 'Caveat', cursive; color: var(--accent); margin-top: 30px; }
.final-date { font-size: 13px; color: var(--muted); margin-top: 15px; letter-spacing: 1px; }
.final-decoration { margin-top: 40px; color: var(--accent2); letter-spacing: 12px; }

.wish {
    display: none;
    max-width: 650px;
    margin: 30px auto;
    padding: 35px;
    background: #ffffff10;
    border: 1px solid #ffffff25;
    border-radius: 20px;
    line-height: 2;
}
.wish.show { display: block; animation: pageIn 1s; }

@media (max-width: 600px) {
    .moon-pair, .moon-layout { grid-template-columns: 1fr; }
    .letter-paper { padding: 25px; }
    .music-toggle { right: 12px; top: 12px; }
    .timeline::before { left: 14px; }
    .timeline-item { padding-left: 44px; }
    .timeline-marker { width: 30px; height: 30px; }
}
</style>
</head>

<body>

<div id="sky"></div>

<button class="music-toggle" id="musicToggle" aria-label="Mute or unmute music">♫</button>

<audio id="backgroundMusic" loop></audio>

<main id="site"></main>

<script>
/* =========================================================
   NIVA COUPLE GIFT TEMPLATE (FIXED)
   Content is loaded from config.json (nested shape).
========================================================= */

let CONFIG = {};
let currentPage = 0;
let musicStarted = false;

const site = document.getElementById("site");
const music = document.getElementById("backgroundMusic");
const musicToggle = document.getElementById("musicToggle");

const escapeHTML = (value = "") =>
  String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);

const safeURL = (value = "") => {
  const url = String(value).trim();
  if (!url) return "";
  if (/^(https?:\/\/|\.{0,2}\/|assets\/|\/)/i.test(url)) return url;
  return "";
};

function getTheme() {
  const theme = CONFIG.theme || {};
  const root = document.documentElement;
  root.style.setProperty("--bg", theme.background || "#100d19");
  root.style.setProperty("--bg2", theme.backgroundSecondary || "#21152b");
  root.style.setProperty("--text", theme.text || "#fff5f7");
  root.style.setProperty("--muted", theme.muted || "#c8b7c8");
  root.style.setProperty("--accent", theme.accent || "#e99ab5");
  root.style.setProperty("--accent2", theme.accentSecondary || "#c8a3ef");
}

function buttonNext(label = "Continue") {
  return `
    <button class="primary advance" type="button">
      ${escapeHTML(label)} <span aria-hidden="true">→</span>
    </button>
  `;
}

function createPage(content, extraClass = "") {
  const page = document.createElement("section");
  page.className = `page ${extraClass}`;
  page.innerHTML = `<div class="wrap">${content}</div>`;
  site.appendChild(page);
  return page;
}

/* ---------------- STARFIELD ---------------- */
function buildStars() {
  const sky = document.getElementById("sky");
  const count = 120;
  let html = "";
  for (let i = 0; i < count; i++) {
    const top = Math.random() * 100;
    const left = Math.random() * 100;
    const delay = (Math.random() * 4).toFixed(2);
    const size = Math.random() > 0.85 ? 3 : 2;
    html += `<span class="star" style="top:${top}%;left:${left}%;width:${size}px;height:${size}px;animation-delay:${delay}s"></span>`;
  }
  sky.innerHTML = html;
}

/* ---------------- MOON PHASE ---------------- */
function getMoonPhase(dateString) {
  const date = new Date(`${dateString}T12:00:00Z`);
  if (Number.isNaN(date.getTime())) {
    return { name: "Moon phase unavailable", illumination: 0.5, age: 0, phase: 0.5 };
  }
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const synodicMonth = 29.530588853 * 24 * 60 * 60 * 1000;
  let ms = ((date.getTime() - knownNewMoon) % synodicMonth + synodicMonth) % synodicMonth;
  const age = ms / (24 * 60 * 60 * 1000);
  const phase = age / 29.530588853;
  const illumination = (1 - Math.cos(phase * 2 * Math.PI)) / 2;

  let name;
  if (age < 1.85 || age > 27.68) name = "New Moon";
  else if (age < 5.54) name = "Waxing Crescent";
  else if (age < 9.23) name = "First Quarter";
  else if (age < 12.92) name = "Waxing Gibbous";
  else if (age < 16.61) name = "Full Moon";
  else if (age < 20.30) name = "Waning Gibbous";
  else if (age < 23.99) name = "Last Quarter";
  else name = "Waning Crescent";

  return { name, illumination, age, phase };
}

function drawMoon(canvas, dateString, seed = 1) {
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const size = canvas.width;
  const center = size / 2;
  const radius = size * 0.40;

  ctx.clearRect(0, 0, size, size);

  const moon = getMoonPhase(dateString);
  const phaseAngle = (moon.phase || 0) * Math.PI * 2;

  const glow = ctx.createRadialGradient(center, center, radius * 0.5, center, center, radius * 1.5);
  glow.addColorStop(0, "rgba(255,240,220,0.15)");
  glow.addColorStop(1, "rgba(255,240,220,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, size, size);

  ctx.save();
  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);
  ctx.clip();

  const base = ctx.createRadialGradient(
    center - radius * 0.28, center - radius * 0.32, radius * 0.08,
    center, center, radius
  );
  base.addColorStop(0, "#f3eee1");
  base.addColorStop(0.55, "#b9b4a9");
  base.addColorStop(1, "#68666a");
  ctx.fillStyle = base;
  ctx.fillRect(center - radius, center - radius, radius * 2, radius * 2);

  let randomSeed = seed * 92821 + 12345;
  function random() {
    randomSeed = (randomSeed * 16807) % 2147483647;
    return (randomSeed - 1) / 2147483646;
  }

  for (let i = 0; i < 65; i++) {
    const angle = random() * Math.PI * 2;
    const distance = Math.sqrt(random()) * radius * 0.91;
    const x = center + Math.cos(angle) * distance;
    const y = center + Math.sin(angle) * distance;
    const craterRadius = 2 + random() * radius * 0.075;

    ctx.beginPath();
    ctx.arc(x, y, craterRadius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(65,65,65,${0.035 + random() * 0.10})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - craterRadius * 0.18, y - craterRadius * 0.18,
      craterRadius * 0.78, Math.PI, Math.PI * 1.8);
    ctx.strokeStyle = "rgba(255,255,255,0.13)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const image = ctx.getImageData(0, 0, size, size);
  const pixels = image.data;

  const sunX = Math.sin(phaseAngle);
  const sunZ = -Math.cos(phaseAngle);
  const sunY = 0.12;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (x - center) / radius;
      const dy = (y - center) / radius;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared > 1) continue;
      const dz = Math.sqrt(1 - distanceSquared);
      const dot = dx * sunX + dy * sunY + dz * sunZ;
      const index = (y * size + x) * 4;
      const brightness = Math.max(0.045, Math.min(1, 0.12 + Math.max(0, dot) * 0.88));
      pixels[index] *= brightness;
      pixels[index + 1] *= brightness;
      pixels[index + 2] *= brightness;
    }
  }

  ctx.putImageData(image, 0, 0);

  const edge = ctx.createRadialGradient(
    center - radius * 0.25, center - radius * 0.28, radius * 0.1,
    center, center, radius
  );
  edge.addColorStop(0, "rgba(255,255,255,0)");
  edge.addColorStop(0.78, "rgba(0,0,0,0.02)");
  edge.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = edge;
  ctx.fillRect(center - radius, center - radius, radius * 2, radius * 2);

  ctx.restore();

  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ---------------- PAGE 1: WELCOME ---------------- */
function buildWelcome() {
  const data = CONFIG.welcome || {};
  return createPage(`
    <div class="welcome-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "A little universe of us")}</div>
      <h1>${escapeHTML(data.title || "Our Story, Written in the Stars")}</h1>
      <p class="subtitle">${escapeHTML(data.subtitle || "Some moments become memories. Some people become home.")}</p>
      <div class="welcome-names">
        ${escapeHTML(CONFIG.couple?.personOne || "You")}
        <span>✦</span>
        ${escapeHTML(CONFIG.couple?.personTwo || "Me")}
      </div>
      <div class="welcome-decoration" aria-hidden="true">♡</div>
      ${buttonNext(data.buttonText || "Open our story")}
    </div>
  `, "welcome-page");
}

/* ---------------- PAGE 2: LETTER ---------------- */
function buildLetter() {
  const data = CONFIG.letter || {};
  const paragraphs = (data.paragraphs && data.paragraphs.length)
    ? data.paragraphs
    : [
      "There are so many things I wish I could tell you, and sometimes words still feel too small.",
      "You have become a beautiful part of my everyday life. Even the simplest moments feel special when they have you in them.",
      "If I could keep one thing forever, it would be the feeling of being able to share this life with you."
    ];

  return createPage(`
    <div class="letter-page-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "A letter from my heart")}</div>
      <div class="letter-paper">
        <h2>${escapeHTML(data.heading || "To My Favourite Person")}</h2>
        <div class="handwritten-letter">
          ${paragraphs.map(p => `<p>${escapeHTML(p)}</p>`).join("")}
        </div>
        <p class="letter-signature">
          ${escapeHTML(data.signoff || "With all my love,")}<br>
          <strong>${escapeHTML(data.senderName || CONFIG.couple?.personOne || "Forever yours")}</strong>
        </p>
      </div>
      ${buttonNext(data.buttonText || "There's something written in the moon")}
    </div>
  `, "letter-page");
}

/* ---------------- PAGE 3: MOONS ---------------- */
function buildMoonPage() {
  const couple = CONFIG.couple || {};
  const moonData = CONFIG.moon || {};
  const personOneDate = couple.personOneDOB || "2000-01-01";
  const personTwoDate = couple.personTwoDOB || "2000-06-01";
  const firstMoon = getMoonPhase(personOneDate);
  const secondMoon = getMoonPhase(personTwoDate);

  return createPage(`
    <div class="moon-page-content">
      <div class="eyebrow">${escapeHTML(moonData.eyebrow || "Written in the universe")}</div>
      <h2>${escapeHTML(moonData.heading || "Two Birthdays. Two Moons. One Story.")}</h2>
      <p class="subtitle">${escapeHTML(moonData.description || "The moon was in a different phase on each of your birthdays. Here's what the sky looked like on those dates.")}</p>
      <div class="moon-pair">
        <div class="moon-card">
          <canvas class="moon-canvas" width="320" height="320" data-moon="one"></canvas>
          <h3>${escapeHTML(couple.personOne || "Person One")}</h3>
          <p>${escapeHTML(personOneDate)}</p>
          <strong>${escapeHTML(firstMoon.name)}</strong>
          <small>${Math.round(firstMoon.illumination * 100)}% illuminated</small>
        </div>
        <div class="moon-card">
          <canvas class="moon-canvas" width="320" height="320" data-moon="two"></canvas>
          <h3>${escapeHTML(couple.personTwo || "Person Two")}</h3>
          <p>${escapeHTML(personTwoDate)}</p>
          <strong>${escapeHTML(secondMoon.name)}</strong>
          <small>${Math.round(secondMoon.illumination * 100)}% illuminated</small>
        </div>
      </div>
      <div class="moon-message">${escapeHTML(moonData.message || "Two different nights, two different skies — and somehow, your stories found a way to meet.")}</div>
      <div class="combined-moon">
        <canvas class="full-moon-canvas" width="360" height="360"></canvas>
        <h3>${escapeHTML(moonData.combinedHeading || "A little universe of our own")}</h3>
        <p>${escapeHTML(moonData.combinedMessage || "Not a scientific moon phase — just a symbol of two lives sharing one beautiful sky.")}</p>
      </div>
      ${buttonNext(moonData.buttonText || "Let's revisit our memories")}
    </div>
  `, "moon-page");
}

/* ---------------- PAGE 4: ALBUM ---------------- */
function buildAlbumPage() {
  const data = CONFIG.album || {};
  const photos = data.photos || [];
  const captions = data.captions || [];

  const items = photos.map((photo, index) => {
    const src = safeURL(photo.src || photo.url || "");
    if (!src) return "";
    const alt = photo.alt || captions[index] || `Memory ${index + 1}`;
    const caption = photo.caption || captions[index] || `Memory ${index + 1}`;
    return `
      <figure class="album-item">
        <img src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" loading="lazy">
        <figcaption>${escapeHTML(caption)}</figcaption>
      </figure>
    `;
  }).join("");

  return createPage(`
    <div class="album-page-content">
      <div class="eyebrow">${escapeHTML(data.eyebrow || "Little pieces of forever")}</div>
      <h2>${escapeHTML(data.heading || "Our Memory Album")}</h2>
      <p class="subtitle">${escapeHTML(data.description || "Every picture holds a moment we never want to lose.")}</p>
      <div class="album-grid">${items}</div>
      ${photos.length ? "" : `<p class="empty-message">Our favourite memories will live here.</p>`}
      ${buttonNext(data.buttonText || "See how our story unfolded")}
    </div>
  `, "album-page");
}

/* ---------------- PAGE 5: TIMELINE ---------------- */

/* ---------------- PAGE 6: GAME ---------------- */

/* ---------------- BUILD ---------------- */
function buildWebsite() {
  site.innerHTML = "";
  buildStars();

  buildWelcome();
  buildLetter();
  buildMoonPage();
  buildAlbumPage();
  buildTimelinePage();
  buildGamePage();
  buildFinalPage();

  const pages = [...site.querySelectorAll(".page")];
  pages.forEach((page, index) => { page.dataset.pageIndex = index; });

  const moonOne = site.querySelector('[data-moon="one"]');
  const moonTwo = site.querySelector('[data-moon="two"]');
  const fullMoon = site.querySelector(".full-moon-canvas");
  drawMoon(moonOne, CONFIG.couple?.personOneDOB || "2000-01-01", 1);
  drawMoon(moonTwo, CONFIG.couple?.personTwoDOB || "2000-06-01", 2);
  drawMoon(fullMoon, "2000-01-21", 3);

  setupPageNavigation(pages);
  setupCoupleGame();
}

/* ---------------- NAVIGATION ---------------- */
function setupPageNavigation(pages) {
  const delay = Number(CONFIG.behaviour?.nextButtonDelay || 6500);

  pages.forEach((page, index) => {
    const nextButton = page.querySelector(".advance");
    if (!nextButton) return;
    nextButton.style.display = index === pages.length - 1 ? "none" : "";
    nextButton.addEventListener("click", () => showPage(index + 1));
  });

  showPage(0);

  // Reveal after delay on page activation.
  function revealFor(index) {
    const page = pages[index];
    if (!page) return;
    const button = page.querySelector(".advance");
    if (!button) return;
    button.classList.remove("visible");

    const gamePageIndex = pages.findIndex(p => p.classList.contains("game-page"));
    if (index === gamePageIndex) return; // game controls its own reveal

    setTimeout(() => {
      if (currentPage === index) button.classList.add("visible");
    }, delay);
  }

  window.__revealFor = revealFor;

  // Also reveal on window scroll bottom.
  window.addEventListener("scroll", () => {
    const page = pages[currentPage];
    if (!page) return;
    const button = page.querySelector(".advance");
    if (!button) return;
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 150) {
      button.classList.add("visible");
    }
  });
}

function showPage(index) {
  const pages = [...site.querySelectorAll(".page")];
  if (index < 0 || index >= pages.length) return;
  currentPage = index;
  pages.forEach((page, i) => page.classList.toggle("active", i === index));
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (typeof window.__revealFor === "function") window.__revealFor(index);
}

/* ---------------- GAME ---------------- */
function setupCoupleGame() {
  const questions = CONFIG.game?.questions || [];
  let questionIndex = 0;
  let score = 0;

  const questionElement = document.getElementById("gameQuestion");
  const optionsElement = document.getElementById("gameOptions");
  const feedbackElement = document.getElementById("gameFeedback");
  const progressElement = document.getElementById("gameProgress");

  if (!questionElement || !optionsElement || !feedbackElement) return;

  if (!questions.length) {
    questionElement.textContent = "The best part of this story is that it belongs to us.";
    optionsElement.innerHTML = "";
    feedbackElement.textContent = "♡";
    const gamePage = site.querySelector(".game-page");
    const btn = gamePage?.querySelector(".advance");
    if (btn) btn.classList.add("visible");
    return;
  }

  function showQuestion() {
    const question = questions[questionIndex];
    progressElement.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
    questionElement.textContent = question.question || "";
    feedbackElement.textContent = "";

    optionsElement.innerHTML = (question.options || []).map((option, index) => `
      <button class="game-option" type="button" data-option="${index}">${escapeHTML(option)}</button>
    `).join("");

    optionsElement.querySelectorAll(".game-option").forEach(button => {
      button.addEventListener("click", () => {
        const selected = Number(button.dataset.option);
        const correct = Number(question.answer);
        optionsElement.querySelectorAll("button").forEach(b => { b.disabled = true; });

        if (selected === correct) {
          score++;
          feedbackElement.textContent = question.success || "You got it! ♡";
        } else {
          feedbackElement.textContent = question.wrong || "That's okay. Every answer is part of our story. ♡";
        }

        setTimeout(() => {
          questionIndex++;
          if (questionIndex < questions.length) {
            showQuestion();
          } else {
            questionElement.textContent = CONFIG.game?.finishedHeading || "And that's our little story!";
            optionsElement.innerHTML = "";
            progressElement.textContent = "Our little game is complete";
            feedbackElement.textContent =
              `${score} out of ${questions.length} — ${CONFIG.game?.endingMessage || "The real prize is the memories we share. ♡"}`;
            const gamePage = site.querySelector(".game-page");
            const btn = gamePage?.querySelector(".advance");
            if (btn) btn.classList.add("visible");
          }
        }, 1400);
      });
    });
  }

  showQuestion();
}

/* ---------------- MUSIC ---------------- */
function setupMusic() {
  const song = CONFIG.song || {};
  if (!music || !musicToggle) return;

  const source = safeURL(song.src || "");
  if (!source) {
    musicToggle.style.display = "none";
    return;
  }

  music.src = source;
  music.loop = song.loop !== false;
  music.volume = Math.min(1, Math.max(0, Number(song.volume ?? 0.65)));

  async function tryPlay() {
    try {
      await music.play();
      musicStarted = true;
      musicToggle.classList.remove("muted");
      musicToggle.classList.add("playing");
      musicToggle.textContent = "♫";
    } catch {
      musicStarted = false;
      musicToggle.classList.add("muted");
      musicToggle.textContent = "♪";
    }
  }

  tryPlay();
  document.addEventListener("pointerdown", () => { if (!musicStarted) tryPlay(); }, { once: true });
  document.addEventListener("keydown", () => { if (!musicStarted) tryPlay(); }, { once: true });

  musicToggle.addEventListener("click", async () => {
    if (music.paused) await tryPlay();
    else {
      music.pause();
      musicToggle.classList.add("muted");
      musicToggle.classList.remove("playing");
      musicToggle.textContent = "♪";
    }
  });
}

/* ---------------- INIT ---------------- */
async function initNivaGift() {
  try {
    const response = await fetch("./config.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Could not load config.json");
    CONFIG = await response.json();

    getTheme();
    buildWebsite();
    setupMusic();

    document.title = CONFIG.siteTitle || "Our Little Story";
  } catch (error) {
    console.error(error);
    site.innerHTML = `
      <section class="page active">
        <div class="wrap">
          <div class="welcome-content">
            <h2>Something went wrong</h2>
            <p class="subtitle">Please check that config.json is in the same folder as template.html.</p>
          </div>
        </div>
      </section>
    `;
  }
}

initNivaGift();
</script>
