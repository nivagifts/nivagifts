<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A Friendship Time Capsule</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="googleFontsLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;500;600;700;800&display=swap">

<style>
:root {
  /* Friendship palette — sunset peach, sage, sky, cream */
  --bg: #fffaf2;
  --bg-warm: #fdf3e6;
  --bg-sage: #eaf2e3;
  --bg-sky: #e6eef7;
  --bg-peach: #fbe4d0;

  --primary: #f0854b;
  --primary-dark: #c65f26;
  --primary-soft: #ffd9bd;

  --sage: #7fa466;
  --sage-dark: #587a44;
  --sage-soft: #d8e6ca;

  --sky: #6a95b8;
  --sky-dark: #476c8a;
  --sky-soft: #d1e0ed;

  --gold: #d9a441;
  --rose: #e890a0;

  --ink: #3a3028;
  --muted: #897a6a;
  --line: #f0e2ce;

  --font-display: 'Fraunces', Georgia, serif;
  --font-script: 'Caveat', cursive;
  --font-body: 'Nunito', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

button { font: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; color: inherit; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

/* ============ LAYOUT ============ */
.section {
  width: 100%;
  padding: 80px 20px;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  position: relative;
  overflow-x: hidden;
}
.section-inner { width: min(100%, 900px); margin: 0 auto; position: relative; z-index: 2; }

.section-eyebrow {
  font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
  color: var(--primary); font-weight: 700;
  margin-bottom: 14px; text-align: center;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(30px, 6vw, 52px);
  font-weight: 500;
  text-align: center;
  margin-bottom: 12px;
  color: var(--ink);
  line-height: 1.15;
}
.section-subtitle {
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  max-width: 520px;
  margin: 0 auto 44px;
  line-height: 1.7;
}

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 32px; min-height: 48px;
  background: var(--primary); color: #fff;
  border-radius: 50px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
  box-shadow: 0 8px 22px rgba(240, 133, 75, 0.3);
  transition: .3s ease;
  margin-top: 26px;
}
.btn:hover { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(240, 133, 75, 0.4); }
.btn.ghost {
  background: transparent;
  color: var(--sage-dark);
  border: 1.5px solid var(--sage);
  box-shadow: none;
}
.btn.ghost:hover { background: var(--sage); color: #fff; }

/* ============ SCENE 1: GIFT BOX ============ */
.scene-gift {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, var(--bg-peach) 0, transparent 55%),
    radial-gradient(circle at 80% 80%, var(--bg-sage) 0, transparent 55%),
    radial-gradient(circle at 50% 50%, var(--bg-sky) 0, transparent 60%),
    var(--bg);
  position: relative;
  overflow: hidden;
}
.scene-gift .section-inner { text-align: center; }

.gift-instruction {
  font-family: var(--font-script);
  font-size: 26px;
  color: var(--primary-dark);
  margin-bottom: 40px;
  opacity: 0.9;
}

/* Gift box */
.gift-box {
  position: relative;
  width: 220px;
  height: 220px;
  margin: 0 auto 30px;
  cursor: pointer;
  transition: transform .3s ease;
  animation: giftFloat 3s ease-in-out infinite;
}
.gift-box:hover { transform: scale(1.05); }
.gift-box.opened { animation: none; transform: scale(0.9); opacity: 0; transition: .8s ease; }

@keyframes giftFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.gift-lid {
  position: absolute;
  top: 30px; left: 20px;
  width: 180px; height: 50px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 8px;
  box-shadow: 0 6px 16px rgba(198, 95, 38, 0.3);
  z-index: 3;
  transform-origin: bottom left;
  transition: transform .8s cubic-bezier(.5, -0.5, .3, 1.4);
}
.gift-box.opened .gift-lid { transform: translate(-40px, -80px) rotate(-25deg); }

.gift-lid::before {
  content: "";
  position: absolute;
  left: 50%; top: 0;
  width: 24px; height: 100%;
  background: var(--gold);
  transform: translateX(-50%);
  border-radius: 4px;
  box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
}

.gift-bow {
  position: absolute;
  top: 8px; left: 50%;
  transform: translateX(-50%);
  font-size: 44px;
  z-index: 4;
  filter: drop-shadow(0 4px 8px rgba(198, 95, 38, 0.3));
  animation: bowWiggle 2s ease-in-out infinite;
}
@keyframes bowWiggle {
  0%, 100% { transform: translateX(-50%) rotate(-6deg); }
  50% { transform: translateX(-50%) rotate(6deg); }
}

.gift-base {
  position: absolute;
  top: 80px; left: 20px;
  width: 180px; height: 130px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: 8px 8px 12px 12px;
  box-shadow: 0 10px 24px rgba(198, 95, 38, 0.3), inset 0 -6px 12px rgba(0,0,0,0.15);
  z-index: 2;
}

.gift-base::before {
  content: "";
  position: absolute;
  left: 50%; top: 0;
  width: 24px; height: 100%;
  background: var(--gold);
  transform: translateX(-50%);
  border-radius: 4px;
  box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
}

.gift-glow {
  position: absolute;
  inset: -30px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 164, 65, 0.35) 0%, transparent 70%);
  animation: glowPulse 2s ease-in-out infinite;
  z-index: 1;
  pointer-events: none;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}

.gift-tap-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 20px;
  animation: tapBounce 1.5s ease-in-out infinite;
}
@keyframes tapBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.gift-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 5vw, 34px);
  color: var(--primary-dark);
  margin-bottom: 12px;
}
.gift-note {
  font-family: var(--font-script);
  font-size: clamp(18px, 4vw, 22px);
  color: var(--muted);
  max-width: 360px;
  margin: 0 auto;
}

/* ============ SCENE 2: NAME + COUNTER ============ */
.scene-hello {
  background: linear-gradient(180deg, var(--bg), var(--bg-warm));
  text-align: center;
}
.hello-names {
  font-family: var(--font-script);
  font-size: clamp(48px, 11vw, 82px);
  color: var(--primary-dark);
  line-height: 1;
  margin-bottom: 8px;
}
.hello-heart {
  font-size: clamp(40px, 9vw, 56px);
  display: block;
  margin: 6px 0;
  animation: heartBeat 2s infinite;
}
@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
}
.hello-tagline {
  font-family: var(--font-script);
  font-size: clamp(22px, 5vw, 30px);
  color: var(--sage-dark);
  margin-top: 20px;
}

/* Counter */
.counter-card {
  margin: 44px auto 0;
  max-width: 620px;
  padding: 32px 24px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 16px 40px rgba(150, 110, 70, 0.12);
}
.counter-label {
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
  font-weight: 700;
}
.counter-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.counter-unit {
  padding: 12px 4px;
  border-radius: 12px;
  background: linear-gradient(145deg, var(--bg-warm), var(--bg-peach));
  border: 1px solid var(--line);
}
.counter-value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 6vw, 36px);
  color: var(--primary-dark);
  line-height: 1;
}
.counter-unit-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
  font-weight: 700;
}
.counter-since {
  margin-top: 18px;
  font-family: var(--font-script);
  font-size: 20px;
  color: var(--sage-dark);
}

/* ============ SCENE 3: STORY ============ */
.scene-story {
  background: linear-gradient(180deg, var(--bg-warm), var(--bg));
}
.chapter-list {
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 640px;
  margin: 0 auto;
}
.chapter {
  position: relative;
  padding: 28px 32px 28px 68px;
  background: #fffdf8;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 8px 22px rgba(150, 110, 70, 0.08);
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity .7s ease, transform .7s ease;
}
.chapter.visible { opacity: 1; transform: translateX(0); }
.chapter::before {
  content: "";
  position: absolute;
  left: 20px; top: 32px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 12px rgba(240, 133, 75, 0.35);
}
.chapter-num { display: none; }
.chapter:nth-child(1)::before { content: "1"; }
.chapter:nth-child(2)::before { content: "2"; background: linear-gradient(145deg, var(--sage), var(--sage-dark)); box-shadow: 0 4px 12px rgba(127, 164, 102, 0.35); }
.chapter:nth-child(3)::before { content: "3"; background: linear-gradient(145deg, var(--sky), var(--sky-dark)); box-shadow: 0 4px 12px rgba(106, 149, 184, 0.35); }
.chapter:nth-child(4)::before { content: "4"; background: linear-gradient(145deg, var(--gold), #b58a2c); box-shadow: 0 4px 12px rgba(217, 164, 65, 0.35); }
.chapter:nth-child(5)::before { content: "5"; }
.chapter-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(17px, 4vw, 20px);
  color: var(--primary-dark);
  margin-bottom: 8px;
}
.chapter-desc {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.7;
  font-family: var(--font-body);
}

/* ============ SCENE 4: CORKBOARD ============ */
.scene-board {
  background:
    radial-gradient(circle at 15% 30%, var(--bg-sage) 0, transparent 55%),
    radial-gradient(circle at 85% 70%, var(--bg-peach) 0, transparent 55%),
    var(--bg);
}
.corkboard {
  position: relative;
  max-width: 820px;
  margin: 0 auto;
  padding: 40px 20px 20px;
  min-height: 500px;
  background:
    radial-gradient(circle at 20% 30%, rgba(139, 90, 43, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.05) 0%, transparent 40%),
    #f5ead6;
  border: 12px solid #c9a77c;
  border-radius: 8px;
  box-shadow:
    0 20px 50px rgba(100, 70, 40, 0.25),
    inset 0 0 60px rgba(139, 90, 43, 0.15);
}

.corkboard::before {
  content: "";
  position: absolute;
  inset: 12px;
  border-radius: 4px;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.1);
  pointer-events: none;
}

.photo-pin {
  position: absolute;
  width: 140px;
  background: #fff;
  padding: 8px 8px 40px;
  box-shadow: 0 6px 18px rgba(100, 70, 40, 0.3);
  transform: rotate(var(--rot, -3deg));
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease, z-index 0s;
  border-radius: 2px;
}
.photo-pin:hover {
  transform: rotate(0) scale(1.05);
  box-shadow: 0 14px 32px rgba(100, 70, 40, 0.4);
  z-index: 10 !important;
}

.photo-pin img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: var(--bg-warm);
  border-radius: 1px;
}
.photo-pin-cap {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  text-align: center;
  font-family: var(--font-script);
  font-size: 16px;
  color: var(--primary-dark);
  line-height: 1.15;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Pin */
.photo-pin::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff6b6b, #b91c1c);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4), inset -2px -2px 4px rgba(0,0,0,0.3), inset 2px 2px 4px rgba(255,255,255,0.4);
  z-index: 2;
}

/* Photo positions */
.photo-pin:nth-child(1) { top: 30px;  left: 6%;   --rot: -4deg;   z-index: 3; }
.photo-pin:nth-child(2) { top: 60px;  right: 8%;  --rot: 3deg;    z-index: 4; }
.photo-pin:nth-child(3) { top: 210px; left: 22%;  --rot: -2deg;   z-index: 5; }
.photo-pin:nth-child(4) { top: 240px; right: 18%; --rot: 5deg;    z-index: 3; }
.photo-pin:nth-child(5) { bottom: 20px; left: 45%; --rot: -3deg;  z-index: 6; }

/* ============ SCENE 5: HIDDEN MESSAGES ============ */
.scene-hidden {
  background: linear-gradient(180deg, var(--bg-sage), var(--bg));
}
.hidden-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  max-width: 760px;
  margin: 0 auto;
}
.flip-card {
  perspective: 1000px;
  height: 180px;
  cursor: pointer;
}
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .8s cubic-bezier(.4, 0, .2, 1);
  transform-style: preserve-3d;
}
.flip-card.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.flip-front, .flip-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  box-shadow: 0 10px 28px rgba(150, 110, 70, 0.15);
}
.flip-front {
  background: linear-gradient(145deg, var(--bg-warm), var(--bg-peach));
  border: 1.5px solid var(--line);
}
.flip-front-icon {
  font-size: 34px;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
}
.flip-front-label {
  font-family: var(--font-script);
  font-size: 22px;
  color: var(--primary-dark);
  font-weight: 600;
}
.flip-front-hint {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.flip-back {
  background: linear-gradient(145deg, var(--sage-soft), var(--bg-sage));
  border: 1.5px solid var(--sage);
  transform: rotateY(180deg);
  color: var(--ink);
}
.flip-back-text {
  font-family: var(--font-script);
  font-size: clamp(16px, 3.8vw, 20px);
  line-height: 1.5;
  color: var(--ink);
  font-weight: 500;
}

/* ============ SCENE 6: MEMORY GAME ============ */
.scene-game {
  background: linear-gradient(180deg, var(--bg), var(--bg-sky));
}
.memory-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 700px;
  margin: 0 auto;
}
.memory-card {
  padding: 24px 20px;
  border-radius: 14px;
  cursor: pointer;
  text-align: center;
  transition: all .4s ease;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.memory-card.myth {
  background: linear-gradient(145deg, #fff5f0, var(--bg-peach));
  border: 1.5px solid var(--primary-soft);
}
.memory-card.truth {
  background: linear-gradient(145deg, #f3f9ee, var(--bg-sage));
  border: 1.5px solid var(--sage-soft);
}
.memory-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(150, 110, 70, 0.15); }
.memory-card-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 10px;
}
.memory-card.myth .memory-card-label { color: var(--primary-dark); }
.memory-card.truth .memory-card-label { color: var(--sage-dark); }
.memory-card-text {
  font-family: var(--font-display);
  font-size: clamp(14px, 3.5vw, 17px);
  line-height: 1.5;
  color: var(--ink);
  font-weight: 500;
}
.memory-card.myth .memory-card-text::before { content: "👀 "; }
.memory-card.truth .memory-card-text::before { content: "✅ "; }

/* ============ SCENE 7: PLAYLIST ============ */
.scene-vibe {
  background: linear-gradient(180deg, var(--bg-sky), var(--bg));
}
.playlist {
  max-width: 560px;
  margin: 0 auto;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 16px 40px rgba(150, 110, 70, 0.12);
}
.playlist-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 18px;
  border-bottom: 1.5px dashed var(--line);
  margin-bottom: 12px;
}
.playlist-icon {
  width: 56px; height: 56px;
  border-radius: 12px;
  background: linear-gradient(145deg, var(--primary), var(--primary-dark));
  display: grid;
  place-items: center;
  font-size: 26px;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 6px 14px rgba(240, 133, 75, 0.3);
}
.playlist-meta { min-width: 0; }
.playlist-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 4px;
}
.playlist-desc {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.track {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
}
.track:last-child { border-bottom: none; }
.track-num {
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--muted);
  width: 22px;
  font-size: 14px;
  flex-shrink: 0;
}
.track-info { flex: 1; min-width: 0; }
.track-name {
  font-weight: 700;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track-artist {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.track-play {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--bg-warm);
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 12px;
  color: var(--primary-dark);
  flex-shrink: 0;
}

/* ============ SCENE 8: CONTRACT ============ */
.scene-contract {
  background:
    radial-gradient(circle at 20% 20%, var(--bg-peach) 0, transparent 55%),
    radial-gradient(circle at 80% 80%, var(--bg-sage) 0, transparent 55%),
    var(--bg);
}
.contract-card {
  max-width: 720px;
  margin: 0 auto;
  padding: 44px 32px;
  background: #fffdf8;
  border: 3px double var(--gold);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(150, 110, 70, 0.15);
  position: relative;
}
.contract-card::before {
  content: "✦";
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);

.scene-stars {

.star-sky {

.star {

  cursor: pointer;
  transition: transform .2s;
}
.star:hover { transform: scale(2); }
@keyframes twinkle {

  50% { opacity: 1; transform: scale(1.3); }
}
.star-memory {

.scene-stars .section-inner { position: relative; z-index: 2; }

/* ============ LIGHTBOX ============ */
.lightbox {
  position: fixed; inset: 0;

.lightbox img {

/* ============ CONFETTI ============ */
.confetti {

  pointer-events: none;
  font-size: 20px;
  z-index: 400;

}
@keyframes confettiFall {

}

/* ============ SCROLL REVEAL ============ */
.reveal {

<script>
"use strict";

/* ============================================================
   STATE
   ============================================================ */
let CONFIG = null;
let counterInterval = null;
let revealObserver = null;
let chapterObserver = null;
let starSkyBuilt = false;

/* ============================================================
   DEFAULTS
   ============================================================ */
function defaults() {
  return {
    name1: "Aarav",
    name2: "Riya",
    sinceDate: "2018-08-15",
    giftTitle: "For You, My Person",

    ],
    boardTitle: "Moments I Keep",
    photos: [],
    photoCaptions: [
      "That one summer",
      "Our first adventure",
      "The rainy-day selfie",
      "That night we got lost",
      "Still going strong"
    ],
    hiddenTitle: "Things I Never Said Out Loud",
    hiddenMessages: [
      "Thank you for showing up when I needed you most — even when I didn't ask.",
      "You make me braver than I would be alone. You probably don't know that.",
      "The way you laugh at your own jokes is my favourite sound in the world.",
      "I don't tell you enough: you're one of the best things that ever happened to me.",
      "If I had to do life all over again, I'd still find you. Every time."
    ],
    gameTitle: "Guess the Memory",
    gameSubtitle: "Tap a card to reveal what really happened.",
    memoryCards: [
      "THE MYTH | We once went skydiving.",
      "THE TRUTH | We watched a skydiving video and cried.",
      "THE MYTH | We have a signature cocktail.",
      "THE TRUTH | It's just sparkling water with a lemon.",
      "THE MYTH | We have our lives together.",
      "THE TRUTH | We're still figuring it out. Together."
    ],
    vibeTitle: "This Is Us",
    vibeTracks: [
      "Song Name — Artist | Why it's ours",
      "Another Song — Artist | The 2am call anthem",
      "One More — Artist | Our road trip song"
    ],
    contractTitle: "The Official Friendship Contract",
    contractIntro: "By continuing to be my best friend, you hereby agree to the following non-negotiable terms.",
    contractClauses: [
      "Clause 1 — Every voice note must be replied to within 24 hours.",
      "Clause 2 — No funny story can be told only once. Repeat it forever.",
      "Clause 3 — If I say 'I have news', you must call. No texting.",
      "Clause 4 — You are legally required to laugh at my worst jokes.",
      "Clause 5 — We will always, always choose each other."
    ],
    finalTitle: "A Sky Full of Us",
    finalBody: "Every star in this sky is a memory we've made together. Some bright, some quiet, all ours. Here's to filling the whole sky.",
    finalFooter: "From your person, always ♥",
    finalButton: "Start over ↻"
  };
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function setText(id, v) {
  const el = document.getElementById(id);
  if (el && v != null) el.textContent = v;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(cfg) {
  // Gift
  setText("giftTitle", cfg.giftTitle);
  setText("giftNote", cfg.giftNote);

  // Hello
  setText("helloNames", (cfg.name1 || "") + " & " + (cfg.name2 || ""));

  // Story
  setText("storyTitle", cfg.storyTitle);
  buildChapters(cfg.chapters || []);

  // Board
  setText("boardTitle", cfg.boardTitle);
  buildCorkboard(cfg.photos || [], cfg.photoCaptions || []);

  // Hidden
  setText("hiddenTitle", cfg.hiddenTitle);
  buildHiddenMessages(cfg.hiddenMessages || []);

  // Game
  setText("gameTitle", cfg.gameTitle);
  setText("gameSubtitle", cfg.gameSubtitle);
  buildMemoryCards(cfg.memoryCards || []);

  // Vibe
  setText("vibeTitle", cfg.vibeTitle);
  setText("playlistName", cfg.vibeTitle);
  buildPlaylist(cfg.vibeTracks || []);

  // Contract
  setText("contractTitle", cfg.contractTitle);
  setText("contractIntro", cfg.contractIntro);
  setText("sigName1", cfg.name1);
  setText("sigName2", cfg.name2);
  buildClauses(cfg.contractClauses || []);

  // Final
  setText("finalTitle", cfg.finalTitle);
  setText("finalBody", cfg.finalBody);
  setText("finalFooter", cfg.finalFooter);
  setText("finalBtn", cfg.finalButton);

  // Start counter
  startCounter(cfg.sinceDate);
}

/* ============================================================
   CHAPTERS
   ============================================================ */
function buildChapters(chapters) {
  const list = document.getElementById("chapterList");
  list.innerHTML = "";

  chapters.forEach((line, i) => {
    const parts = String(line).split("|").map(s => s.trim());
    const title = parts[0] || "";
    const desc = parts[1] || "";

    const div = document.createElement("div");
    div.className = "chapter";
    div.style.transitionDelay = (i * 0.1) + "s";
    div.innerHTML =
      '<div class="chapter-title">' + esc(title) + '</div>' +
      '<div class="chapter-desc">' + esc(desc) + '</div>';
    list.appendChild(div);
  });

  requestAnimationFrame(() => {
    if (chapterObserver) chapterObserver.disconnect();
    if (!("IntersectionObserver" in window)) {
      list.querySelectorAll(".chapter").forEach(el => el.classList.add("visible"));
      return;
    }
    chapterObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          chapterObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    list.querySelectorAll(".chapter").forEach(el => chapterObserver.observe(el));
  });
}

/* ============================================================
   CORKBOARD PHOTOS
   ============================================================ */
function buildCorkboard(photos, captions) {
  const board = document.getElementById("corkboard");
  board.innerHTML = "";

  const list = photos.slice(0, 5);

  for (let i = 0; i < 5; i++) {
    const src = list[i];
    const capText = captions[i] || "";

    const pin = document.createElement("div");
    pin.className = "photo-pin";

    if (src) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = capText || "Memory";
      img.loading = "lazy";
      img.onerror = function () {
        this.style.background = "linear-gradient(135deg, var(--bg-warm), var(--bg-sage))";
        this.style.opacity = "0.5";
      };
      img.addEventListener("click", () => openLightbox(src));
      pin.appendChild(img);

      const cap = document.createElement("div");
      cap.className = "photo-pin-cap";
      cap.textContent = capText;
      pin.appendChild(cap);
    } else {
      // Placeholder
      const placeholder = document.createElement("div");
      placeholder.style.cssText =
        "width:100%;aspect-ratio:1;background:linear-gradient(135deg,var(--bg-warm),var(--bg-sage));" +
        "border-radius:1px;display:grid;place-items:center;font-size:28px;color:var(--primary);";
      placeholder.textContent = "✿";
      pin.appendChild(placeholder);

      if (capText) {
        const cap = document.createElement("div");
        cap.className = "photo-pin-cap";
        cap.textContent = capText;
        pin.appendChild(cap);
      }
    }

    board.appendChild(pin);
  }
}

/* ============================================================
   HIDDEN MESSAGES
   ============================================================ */
function buildHiddenMessages(messages) {
  const grid = document.getElementById("hiddenGrid");
  grid.innerHTML = "";

  const icons = ["💌", "🌿", "⭐", "✨", "💛", "🎈"];

  messages.forEach((msg, i) => {
    const card = document.createElement("div");
    card.className = "flip-card";
    card.innerHTML =
      '<div class="flip-card-inner">' +
        '<div class="flip-front">' +
          '<div class="flip-front-icon">' + icons[i % icons.length] + '</div>' +
          '<div class="flip-front-label">Message ' + (i + 1) + '</div>' +
          '<div class="flip-front-hint">tap to open</div>' +
        '</div>' +
        '<div class="flip-back">' +
          '<div class="flip-back-text">' + esc(msg) + '</div>' +
        '</div>' +
      '</div>';
    card.addEventListener("click", () => card.classList.toggle("flipped"));
    grid.appendChild(card);
  });
}

/* ============================================================
   MEMORY CARDS
   ============================================================ */
function buildMemoryCards(cards) {
  const grid = document.getElementById("memoryGrid");
  grid.innerHTML = "";

  cards.forEach(line => {
    const parts = String(line).split("|").map(s => s.trim());
    const label = parts[0] || "";
    const text = parts[1] || "";
    const isMyth = /myth/i.test(label);

    const card = document.createElement("div");
    card.className = "memory-card " + (isMyth ? "myth" : "truth");
    card.innerHTML =
      '<div class="memory-card-label">' + esc(label) + '</div>' +
      '<div class="memory-card-text">' + esc(text) + '</div>';
    grid.appendChild(card);
  });
}

/* ============================================================
   PLAYLIST
   ============================================================ */
function buildPlaylist(tracks) {
  const list = document.getElementById("trackList");
  list.innerHTML = "";

  tracks.forEach((line, i) => {
    const parts = String(line).split("|").map(s => s.trim());
    const songPart = parts[0] || "";
    const reason = parts[1] || "";

    const dashSplit = songPart.split("—").map(s => s.trim());
    const songName = dashSplit[0] || songPart;
    const artist = dashSplit[1] || "";

    const track = document.createElement("div");
    track.className = "track";
    track.innerHTML =
      '<div class="track-num">' + (i + 1) + '</div>' +
      '<div class="track-info">' +
        '<div class="track-name">' + esc(songName) + '</div>' +
        '<div class="track-artist">' + esc(artist || reason) + '</div>' +
      '</div>' +
      '<div class="track-play">▶</div>';
    list.appendChild(track);
  });
}

/* ============================================================
   CONTRACT CLAUSES
   ============================================================ */
function buildClauses(clauses) {
  const list = document.getElementById("clauseList");
  list.innerHTML = "";

  clauses.forEach((clause, i) => {
    const div = document.createElement("div");
    div.className = "clause";
    div.innerHTML =
      '<div class="clause-icon">' + (i + 1) + '</div>' +
      '<div>' + esc(clause) + '</div>';
    list.appendChild(div);
  });
}

/* ============================================================
   FRIENDSHIP COUNTER
   ============================================================ */
function startCounter(sinceDate) {
  if (counterInterval) clearInterval(counterInterval);
  if (!sinceDate) return;

  const since = new Date(sinceDate);
  if (isNaN(since.getTime())) return;

  const update = () => {
    const diff = Date.now() - since.getTime();
    if (diff < 0) return;

    const secs = Math.floor(diff / 1000);
    const mins = Math.floor(secs / 60);
    const hours = Math.floor(mins / 60);
    const days = Math.floor(hours / 24);

    setText("cntDays", String(days));
    setText("cntHours", String(hours % 24));
    setText("cntMins", String(mins % 60));
    setText("cntSecs", String(secs % 60));

    const y = since.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
    setText("counterSince", "since " + y);
    setText("helloTimesline", "friends since " + since.getFullYear());
  };

  update();
  counterInterval = setInterval(update, 1000);
}

/* ============================================================
   STAR SKY
   ============================================================ */
function buildStarSky(messages) {
  const sky = document.getElementById("starSky");
  if (!sky || starSkyBuilt) return;
  sky.innerHTML = "";

  const count = Math.max(40, Math.min(80, messages.length * 12));
  const memoryPool = messages.length ? messages : ["you", "always", "us"];

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    star.className = "star";

    const size = 1 + Math.random() * 2.5;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = (Math.random() * 3) + "s";
    star.style.animationDuration = (2 + Math.random() * 3) + "s";

    const memory = memoryPool[i % memoryPool.length];
    star.addEventListener("click", () => showStarMemory(memory));
    sky.appendChild(star);
  }

  starSkyBuilt = true;
}

function showStarMemory(text) {
  const el = document.getElementById("starMemory");
  if (!el) return;
  el.textContent = text.length > 120 ? text.slice(0, 120) + "…" : text;
  el.classList.add("show");
  clearTimeout(showStarMemory._t);
  showStarMemory._t = setTimeout(() => el.classList.remove("show"), 2500);
}

/* ============================================================
   SCROLL + REVEAL
   ============================================================ */
function scrollToScene(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
}

function setupReveal() {
  if (!("IntersectionObserver" in window)) {
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("visible"));
    return;
  }
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".reveal").forEach(el => {
    if (!el.classList.contains("visible")) revealObserver.observe(el);
  });
}

/* ============================================================
   GIFT BOX OPEN
   ============================================================ */
function openGift() {
  const box = document.getElementById("giftBox");
  if (!box || box.classList.contains("opened")) return;
  box.classList.add("opened");
  celebrate(30);
  setTimeout(() => {
    scrollToScene("scene-hello");
  }, 900);
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
function openLightbox(src) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");
  if (!lb || !img) return;
  img.src = src;
  lb.classList.add("open");
}
function closeLightbox(e) {
  if (e && e.target && e.target.tagName === "IMG" && e.target.id !== "lightboxImg") return;
  const lb = document.getElementById("lightbox");
  if (lb) lb.classList.remove("open");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});

/* ============================================================
   CONFETTI
   ============================================================ */
function celebrate(count = 25) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const emojis = ["💛", "⭐", "🌿", "✿", "💫", "🎀", "🎉"];
  for (let i = 0; i < count; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "%";
    c.style.top = "-20px";
    c.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    c.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

/* ============================================================
   RESTART
   ============================================================ */
function restartAll() {
  const box = document.getElementById("giftBox");
  if (box) box.classList.remove("opened");
  starSkyBuilt = false;
  setTimeout(() => scrollToScene("scene-gift"), 100);
}

/* ============================================================
   NORMALIZE ARRAYS
   ============================================================ */
function normalizeArrays(cfg) {
  const toArr = (v, fallback) => {
    if (Array.isArray(v)) return v.filter(x => x != null && String(x).trim() !== "");
    if (typeof v === "string") return v.split("\n").map(s => s.trim()).filter(Boolean);
    return fallback;
  };
  const def = defaults();
  cfg.photos = Array.isArray(cfg.photos) ? cfg.photos : [];
  cfg.photoCaptions = toArr(cfg.photoCaptions, def.photoCaptions);
  cfg.chapters = toArr(cfg.chapters, def.chapters);
  cfg.hiddenMessages = toArr(cfg.hiddenMessages, def.hiddenMessages);
  cfg.memoryCards = toArr(cfg.memoryCards, def.memoryCards);
  cfg.vibeTracks = toArr(cfg.vibeTracks, def.vibeTracks);
  cfg.contractClauses = toArr(cfg.contractClauses, def.contractClauses);
  return cfg;
}

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  CONFIG = defaults();
  render(CONFIG);
  setupReveal();

  // Attach gift click
  const box = document.getElementById("giftBox");
  if (box) {
    box.addEventListener("click", openGift);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openGift();
      }
    });
  }

  // Fetch config.json
  fetch("config.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(json => {
      if (!json) return;
      CONFIG = normalizeArrays({ ...defaults(), ...json });
      render(CONFIG);
      setupReveal();
      buildStarSky(CONFIG.hiddenMessages);
    })
    .catch(() => {});

  // Build star sky with default messages initially
  buildStarSky(CONFIG.hiddenMessages);

  // NIVA editor live preview
  window.addEventListener("message", (event) => {
    if (event.origin !== window.location.origin) return;
    const msg = event.data || {};

    if (msg.type === "NIVA_PREVIEW_UPDATE" && msg.data) {
      const merged = normalizeArrays({ ...defaults(), ...msg.data });
      CONFIG = merged;
      render(CONFIG);
      setupReveal();
      starSkyBuilt = false;
      buildStarSky(CONFIG.hiddenMessages);
    }

    if (msg.type === "NIVA_PREVIEW_PING") {
      try { window.parent.postMessage({ type: "NIVA_PREVIEW_READY" }, window.location.origin); } catch {}
    }
  });

  // Announce readiness
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "NIVA_PREVIEW_READY" }, window.location.origin);
    }
  } catch {}
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot, { once: true });
} else {
  boot();
}
</script>
