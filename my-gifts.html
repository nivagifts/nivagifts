<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf8f3">
  <title>My Gifts | NIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg-cream: #fdf8f3; --bg-blush: #faf0ea; --bg-rose: #f9e8e4; --bg-white: #fff;
      --panel: #fffaf6; --panel-2: #fff5ef;
      --rose: #d4878e; --rose-deep: #b76e79; --rose-light: #f0c4c8;
      --champagne: #d4b896; --gold: #c9a961;
      --text: #3d2c2e; --text-2: #6b5557; --text-muted: #9e8588;
      --line: #f0dfd8; --line-soft: #f7ebe5; --line-rose: #e8c4c8;
      --danger: #c75b65;
      --display: 'Playfair Display', Georgia, serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
      --shadow-md: 0 12px 40px rgba(183,110,121,0.12);
      --shadow-lg: 0 24px 70px rgba(183,110,121,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-cream); color: var(--text);
      font-family: var(--sans); min-height: 100vh; line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(ellipse at 15% 0%, rgba(212,135,142,0.1) 0%, transparent 40%),
                        radial-gradient(ellipse at 85% 100%, rgba(212,184,150,0.08) 0%, transparent 40%);
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(900px, calc(100% - 40px)); margin: auto; padding: 40px 0 80px; }
    .head { text-align: center; margin-bottom: 40px; }
    .head h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 8px; }
    .head p { color: var(--text-2); font-family: var(--serif); font-size: 1rem; margin: 0; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--rose-deep); font-size: 0.84rem; margin-bottom: 20px; font-weight: 500; }
    .back:hover { color: var(--rose); }
    .gifts-list { display: grid; gap: 16px; }
    .gift-card {
      display: flex; align-items: center; gap: 16px; padding: 20px;
      border: 1px solid var(--line-soft); border-radius: 16px; background: var(--panel);
      box-shadow: 0 4px 16px rgba(183,110,121,0.06);
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .gift-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-rose); }
    .gift-icon {
      width: 52px; height: 52px; display: grid; place-items: center;
      border-radius: 14px; background: var(--bg-rose); border: 1px solid var(--line-rose);
      color: var(--rose-deep); font-size: 1.4rem; flex-shrink: 0;
    }
    .gift-info { flex: 1; min-width: 0; }
    .gift-info h3 { font-family: var(--display); font-size: 1.1rem; margin: 0 0 4px; color: var(--text); }
    .gift-info p { margin: 0; font-size: 0.76rem; color: var(--text-muted); overflow-wrap: anywhere; }
    .gift-badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.6rem; font-weight: 600;
      background: rgba(107,142,107,0.1); color: #6b8e6b; border: 1px solid rgba(107,142,107,0.3);
      white-space: nowrap;
    }
    .gift-badge.pending { background: rgba(212,184,150,0.15); color: #b8986e; border-color: rgba(212,184,150,0.4); }
    .gift-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .gift-actions button, .gift-actions a {
      padding: 8px 14px; border-radius: 999px; font-size: 0.74rem; font-weight: 500;
      border: 1px solid var(--line-rose); background: var(--panel); color: var(--rose-deep);
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .gift-actions button:hover, .gift-actions a:hover { border-color: var(--rose); background: var(--bg-rose); }
    .gift-actions .delete { color: var(--danger); border-color: rgba(199,91,101,0.3); }
    .gift-actions .delete:hover { background: rgba(199,91,101,0.08); border-color: var(--danger); }
    .empty-state {
      text-align: center; padding: 60px 24px; border: 1px dashed var(--line-rose);
      border-radius: 20px; background: var(--panel);
    }
    .empty-state .icon { font-size: 2.6rem; color: var(--rose); margin-bottom: 16px; }
    .empty-state h2 { font-family: var(--display); font-weight: 500; font-size: 1.6rem; margin: 0 0 8px; }
    .empty-state p { color: var(--text-2); font-size: 0.92rem; font-family: var(--serif); margin: 0 0 24px; }
    .empty-state .btn {
      display: inline-flex; padding: 12px 24px; border-radius: 999px;
      background: linear-gradient(110deg, var(--rose-deep), var(--rose));
      color: #fff; font-size: 0.86rem; font-weight: 500; border: 1px solid var(--rose);
      box-shadow: 0 8px 24px rgba(183,110,121,0.28); transition: transform 0.25s;
    }
    .empty-state .btn:hover { transform: translateY(-2px); }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none; background: var(--panel);
      border: 1px solid var(--line-rose); border-radius: 14px; padding: 14px 20px;
      box-shadow: var(--shadow-lg); font-size: 0.84rem; transition: 0.35s; z-index: 100;
      max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 600px) {
      .gift-card { flex-wrap: wrap; }
      .gift-actions { width: 100%; justify-content: flex-end; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="./index.html" class="back">← Back to NIVA</a>
    <div class="head">
      <h1>My Gifts</h1>
      <p>Every little world you've created.</p>
    </div>
    <div class="gifts-list" id="giftsList">
      <div class="empty-state"><div class="icon">✦</div><h2>Loading…</h2></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      "use strict";
      const list = document.getElementById("giftsList");
      const toast = document.getElementById("toast");

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      async function loadGifts() {
        try {
          const res = await fetch("/api/gifts", { credentials: "same-origin", cache: "no-store" });
          if (res.status === 401) { window.location.href = "./index.html?login=required"; return; }
          const data = await res.json();
          const gifts = data.gifts || [];

          if (!gifts.length) {
            list.innerHTML = `<div class="empty-state"><div class="icon">♥</div><h2>No gifts yet.</h2><p>Create your first gift and make someone's day.</p><a class="btn" href="./index.html#templates">Explore templates ↗</a></div>`;
            return;
          }

          list.innerHTML = gifts.map(g => {
            const url = new URL(g.url, window.location.origin).href;
            return `
              <div class="gift-card">
                <div class="gift-icon">♥</div>
                <div class="gift-info">
                  <h3>${g.templateId.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</h3>
                  <p>${url}</p>
                </div>
                <span class="gift-badge ${g.paid ? '' : 'pending'}">${g.paid ? '✓ Published' : '⏳ Pending'}</span>
                <div class="gift-actions">
                  <button class="copy" data-url="${url}">Copy link</button>
                  <button class="delete" data-id="${g.publicId}">Delete</button>
                </div>
              </div>`;
          }).join('');

          // Bind copy buttons
          document.querySelectorAll('.copy').forEach(btn => {
            btn.addEventListener('click', async () => {
              try { await navigator.clipboard.writeText(btn.dataset.url); showToast("Link copied!"); }
              catch { showToast("Could not copy."); }
            });
          });

          // Bind delete buttons
          document.querySelectorAll('.delete').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (!confirm("Delete this gift? This cannot be undone.")) return;
              try {
                const res = await fetch(`/api/gifts/${btn.dataset.id}`, { method: 'DELETE', credentials: 'same-origin' });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || "Delete failed.");
                showToast("Gift deleted.");
                loadGifts();
              } catch (err) { showToast(err.message || "Could not delete."); }
            });
          });

        } catch (err) {
          list.innerHTML = `<div class="empty-state"><div class="icon">✦</div><h2>Could not load gifts.</h2><p>${err.message}</p></div>`;
        }
      }

      loadGifts();
    })();
  </script>
</body>
</html>
